. 【邏輯檢驗】：你們認為這個問題值得解決的前提是什麼？有哪些客觀事實或數據支持？\n2. 【創意檢驗】：目前市場上既有的解法是什麼？你們的構想在哪些地方打破了常規？\n3. 【執行檢驗】：如果要在本學期內做出一個可以讓同學點擊預約的單頁網頁，你們第一步該做什麼？\n小組指派代表，準備於課堂尾聲進行 2 分鐘精彩分享！"}]}, {"week_num": 3, "module": "模組一：AI 浪潮與企劃思維啟蒙", "title": "行銷企劃目標：問題界定、機會洞察與具體生動的目標設定", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 目標工程", "title": "行銷企劃目標：問題界定、機會洞察與具體生動的目標設定", "subtitle": "企劃源自問題與機會 ｜ 策略層次 vs 技術層次 ｜ 將圖像與感覺帶入目標 ｜ CLEAR 提示架構", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "經典案例破題", "title": "案例沉思：某漢堡連鎖店業績下滑，降價促銷為什麼反而加速倒閉？", "quote": "「某漢堡店門市銷售量日益萎縮。店長認為問題是『價格太貴』，於是連續三個月推出買一送一。結果吸引了一堆撿便宜的過路客，卻累垮員工、服務品質暴跌，原本忠實的上班族常客紛紛離去。店長只看到了業績衰退的『表徵』，卻完全忽略了核心真因是『出餐等待時間過長且內用環境嘈雜』！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 2 章案例啟示"}, {"num": 3, "type": "2card", "tag": "行銷問題層次剖析", "title": "行銷企劃的源頭：行銷問題（Marketing Problems）的兩大層次", "subtitle": "策略層次決定方向對錯，技術層次決定執行優劣", "cards": [{"title": "策略層次問題（Strategic Level）", "desc": "涉及企業長期生存、定位與方向的大是大非", "points": ["問題本質：做對的事情（Doing the right things）", "典型情境：面臨少子化與國外品牌夾擊，兒童食品廠是否應轉型成人營養市場？", "牽涉範圍：目標市場選擇、產品定位、品牌轉型、長遠營運模式", "重要性：策略一旦走錯方向，技術執行再完美也只是加速滅亡"]}, {"title": "技術層次問題（Tactical Level）", "desc": "在正確策略方向下，優化特定行銷環節的執行成效", "points": ["問題本質：把事情做對（Doing things right）", "典型情境：新產品社群廣告點擊率低於同業、門市貨架陳列無法吸引目光", "牽涉範圍：文案風格、定價折扣技巧、通路陳列、廣告投放受眾微調", "解決之道：可透過 A/B 測試、提示詞重構與敏捷迭代迅速修正"]}]}, {"num": 4, "type": "3card", "tag": "行銷機會辨認", "title": "行銷企劃的另一個起點：行銷機會（Marketing Opportunities）", "subtitle": "洞察外在變遷中的潛在未滿足需求，搶佔藍海新賽道", "cards": [{"title": "1. 浮現中的新需求", "desc": "生活型態變遷催生全新消費渴望", "points": ["高齡化趨勢：不只照顧生理健康，更渴求有尊嚴的情感陪伴與社交", "獨食與毛孩經濟：單身人口增長帶動個人精緻餐飲與寵物高階照護", "企劃切入點：比競爭者搶先一步定義全新的產品類別與生活提案"]}, {"title": "2. 現有產品的體驗缺口", "desc": "消費者對現存方案感到不便或忍受缺陷", "points": ["繁瑣痛苦：傳統預約流程繁雜、資訊透明度低、溝通成本巨大", "性價比失衡：市場方案要麼太貴太複雜，要麼陽春無品質保證", "企劃切入點：以簡約極致的微型數位服務消滅體驗摩擦力"]}, {"title": "3. 科技應用帶來的創新場景", "desc": "新科技讓過去不可能的服務體驗成為現實", "points": ["生成式 AI 與 Agent：個人化專屬推薦、24小時虛擬諮詢、極速原型打造", "行動定位與物聯網：隨選即用的情境式微型商業服務", "企劃切入點：結合企劃學理將技術包裝為溫暖可感的顧客體驗"]}]}, {"num": 5, "type": "3card", "tag": "目標設定要素", "title": "設定優良企劃目標的三大不可或缺要素（曾光華企劃架構）", "subtitle": "清晰具體的目標是引領團隊向前衝刺的燈塔", "cards": [{"title": "要素一：明確界定核心問題或機會", "desc": "切中本質真因，杜絕浮於表面的現象描述", "points": ["深入挖掘『為什麼』：漢堡銷量差是因為出餐慢，出餐慢是因為廚房動線混亂", "鎖定關鍵利害關係人：明確指出企劃是為解決哪一群消費者的痛苦", "因應方向對焦：清楚定義本次企劃的主攻戰場"]}, {"title": "要素二：清楚具體的預期成果", "desc": "敘述必須精確、具備可驗證與衡量標準", "points": ["避免模糊空泛：嚴禁使用『顯著提升品牌知名度』等抽象詞彙", "可量化指標：三個月內吸引 1,000 位萬能師生註冊、取得 150 筆有效預約", "時間明確：明定達成該項成果的精確基準點與截止日"]}, {"title": "要素三：激勵人心的圖像與感覺", "desc": "賦予冰冷數字生命力，點燃團隊熱情與顧客嚮往", "points": ["超越撲克臉式的數字：行銷充滿感性、美感與體驗", "描摹成功畫面：讓主管與組員在腦海中看見顧客滿意微笑的特寫", "凝聚共識信念：讓企劃成為值得全員投入熱血的使命"]}]}, {"num": 6, "type": "4card", "tag": "目標設定四途徑", "title": "利用四個科學途徑設定行銷企劃目標（曾光華方法論）", "subtitle": "拒絕拍腦袋空想，以多元視角奠定紮實目標根據", "cards": [{"title": "1. 與利害關係人討論", "desc": "直接深入溝通，凝聚共識", "points": ["訪談主管、組員與第一線人員", "確認各方期望與承載極限", "提早化解潛在內部阻礙"]}, {"title": "2. 請教專家意見", "desc": "借鏡產業前輩與專業學者的智慧", "points": ["洞察產業常規與關鍵陷阱", "掌握同業平均績效基準值", "獲取前瞻趨勢與法規提醒"]}, {"title": "3. 次級資料深入分析", "desc": "客觀公正的數據情報庫", "points": ["政府公開統計與產業研究報告", "歷史銷售數據與客群行為記錄", "花費低、速度快、具公信力"]}, {"title": "4. 進行質性研究探索", "desc": "深入探求消費者背後的真實心聲", "points": ["焦點團體訪談（FGD）", "一對一深度生活情境訪談", "挖掘難以在問卷中表達的隱性渴望"]}]}, {"num": 7, "type": "2card", "tag": "目標修煉精髓", "title": "將【圖像與感覺】帶入企劃目標：死板數字 vs 鮮活生命力", "subtitle": "在高度感性與體驗的行銷世界裡，單純的理性就像乏味的撲克臉", "cards": [{"title": "死板乏味的傳統企劃目標（缺乏靈魂）", "desc": "「本企劃預計於 12 月底前，提升某某校園二手書媒合服務的交易量達 30%，並在校園社團發布 20 篇宣傳貼文。」", "points": ["缺點診斷：純粹冷冰冰的數字拼湊，看完毫無心動感", "團隊感受：像是在被動應付上級交辦的 KPI 指標", "顧客視角：完全感受不到這項服務能為自己的大學生活帶來什麼美好改變"]}, {"title": "具備圖像與感覺的鮮活企劃目標（充滿感染力）", "desc": "「在期末考結束的夕陽下，讓每一位萬能學子能在 3 分鐘內透過手機，將陪伴自己一學期的愛書親手交給學弟妹，伴隨著一張溫暖的手寫留言卡，讓知識在校園角落溫柔流轉，並達成 300 冊的愛心傳承。」", "points": ["優勢解析：帶入視覺（夕陽、書籍）、觸覺（手寫卡）與心靈溫度", "激勵效果：團隊腦海中浮現清晰畫面，清楚知道為何而戰", "商業效益：情感感染力大幅提升消費者的參與意願與轉發率"]}]}, {"num": 8, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "CLEAR 提示詞框架：將模糊痛點轉譯為高規格 SMART 企劃目標書", "subtitle": "引導 AI 成為嚴謹的企劃諮詢教練，拒絕空泛籠統的回覆", "cards": [{"title": "Context（背景脈絡）＋ Logic（邏輯依據）", "desc": "向 AI 完整交代專案產業情境與曾光華企劃架構", "points": ["明確告知：我們是萬能企管大一微型創業團隊，鎖定校園外送延誤痛點", "輸入依據：提供二手研究數據、師生訪談摘要與既有同業缺陷", "設定限制：嚴格遵循邏輯與客觀事實，禁止生成虛構案例"]}, {"title": "Expectation（期望產出）＋ Action（行動指標）", "desc": "要求產出兼具 SMART 原則與生命力的企劃目標", "points": ["定量指標：明確列出短期（1個月）、中期（學期末）之關鍵轉換數據", "定性願景：要求將『圖像與感覺』融入願景陳述，描摹使用者感動情境", "風險預警：要求主動列出目標達成過程中最可能遭遇的執行瓶頸"]}, {"title": "Review（多角度審查驗收）", "desc": "指揮 AI Agent 扮演嚴苛企劃主管進行批判", "points": ["壓力測試：『如果預算只有 1,000 元，這個目標可行嗎？』", "目標層次校對：檢核設定的目標是否混淆了『策略』與『技術』", "確立小組專案最終的《微型創業目標規格書》"]}]}, {"num": 9, "type": "content", "tag": "課堂數位工作表實作", "title": "課堂研討工作坊：撰寫小組《有生命力的微型創業企劃目標卡》", "content": "【分組實作挑戰】：\n請各組打開手機，開啟線上協作工作表：\n1. 寫出小組專案要解決的【核心真因】（非表象現象）。\n2. 寫出一組傳統死板的 KPI 目標（包含時間與預期量化數字）。\n3. 運用曾光華教授方法，將【圖像與感覺】注入其中，改寫為一段 100 字內、極具畫面感與生活溫度的鮮活企劃目標！\n4. 教師將隨機挑選 3 組即時投影至大螢幕，進行現場點評與調優！"}]}, {"week_num": 4, "module": "模組一：AI 浪潮與企劃思維啟蒙", "title": "外部環境分析：PESTC 矩陣辨認機會與威脅，撰寫具說服力的企劃背景", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 市場洞察", "title": "外部環境分析：PESTC 矩陣辨認機會與威脅，撰寫具說服力的企劃背景", "subtitle": "外部環境分析與企劃說服力 ｜ 微故事企劃背景 ｜ PESTC 分析架構 ｜ 消費者心理與行為動機", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "企劃背景對比破題", "title": "企劃背景撰寫大對決：空洞的大道理 vs 具備五感體驗的微故事", "quote": "「傳統企劃書常寫：『隨著全球氣候變遷加劇與環保意識抬頭，循環經濟已成為不可逆趨勢……』（主管看兩行就哈欠連天）。反觀英國新創眼鏡品牌：『在英格蘭西南海邊，漁民收網時總感嘆被丟棄的尼龍漁網成了海洋殺手。我們與當地漁民合作，將廢棄漁網重塑為時尚太陽眼鏡。消費者戴上眼鏡的那一刻，海風吹拂臉龐，他感覺自己買的不僅是遮陽工具，更是一份守護海洋的驕傲！』——第二篇不談大道理，而是透過極具畫面感與五感體驗的微故事，展現強大說服力！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 3 章範例"}, {"num": 3, "type": "3card", "tag": "外部分析核心價值", "title": "為什麼必須做外部環境分析？支撐企劃說服力的三大理由", "subtitle": "企劃若無法證明有所憑據，再美妙的構想也只是空中樓閣", "cards": [{"title": "1. 找出趨吉避凶的大方向", "desc": "大環境趨勢帶來商機，也隱藏致命陷阱", "points": ["順勢而為事半功倍：搭上政策扶持、綠色消費或 AI 應用趨勢", "提早避開暗礁：警惕法規緊縮、人口結構萎縮與原材料成本上漲", "策略定錨：在動態變局中找準小團隊的最佳切入生存空間"]}, {"title": "2. 展現方案憑據以增進說服力", "desc": "讓決策主管與投資人相信方案切實可行", "points": ["拒絕主觀臆測：企劃結論不是『我個人覺得』，而是『市場數據顯示』", "客觀佐證：引用政府統計公報、第三方公信力機構之調查", "說服力倍增：紮實的外部依據能瞬間擊破外界的質疑與顧慮"]}, {"title": "3. 累積市場常識與利於撰寫背景", "desc": "『企劃背景』直接決定了整本企劃案的第一印象", "points": ["掌握產業脈動：熟稔目標客群的流行語彙、生活型態與痛點焦點", "打造黃金開局：以引人入勝的微故事或市場矛盾吸引閱讀者目光", "為後續提案鋪路：順理成章引導出本次企劃的必要性與迫切性"]}]}, {"num": 4, "type": "4card", "tag": "PESTC 架構剖析", "title": "PESTC 總體外部環境與競爭者分析架構（曾光華矩陣模型）", "subtitle": "全面涵蓋影響商業運作的五大宏觀與微觀力量", "cards": [{"title": "P（政治與法律環境）", "desc": "政策方向、法規規範與政府扶持政策", "points": ["個資保護法與資安合規要求", "青年創新創業與 USR/SDGs 政策補助", "特定產業准入門檻與衛生安全標準"]}, {"title": "E（經濟環境因素）", "desc": "消費能力、物價所得與經濟景氣預期", "points": ["通膨物價上漲對大學生生活費的排擠效應", "追求高性價比、極致簡約的理性消費型態", "微型副業與靈活用工趨勢興起"]}, {"title": "S（社會與文化環境）", "desc": "人口結構、生活風格與價值觀念變遷", "points": ["少子化與高齡化雙重浪潮", "重視生活體驗、情緒價值與個人化風格", "社群網路文化與短影音資訊接收習慣"]}, {"title": "T（科技與技術創新）", "desc": "新技術之突破與消費情境的重構", "points": ["AI Agent 自動化工具的平民化普及", "行動支付與無接觸微型數位商業模式", "開源社群與無伺服器雲端技術降門檻"]}]}, {"num": 5, "type": "2card", "tag": "競爭者深度剖析", "title": "PESTC 的第五關鍵要素：【C（競爭者分析）】", "subtitle": "競爭分析不只要瞭解直接對手，更要看清隱形與潛在替代者", "cards": [{"title": "直接競爭者 vs 替代性競爭者", "desc": "搶奪顧客時間與錢包的往往不是同行", "points": ["直接競爭者：販售相似產品、鎖定相同客群的現有廠商（如校內傳統影印店 vs 自助雲端影印）", "替代性競爭者：以完全不同形式滿足相同底層需求的跨界者（如手搖飲的對手不是另一家手搖飲，而是超商瓶裝水或手沖咖啡）", "隱形對手：消費者『選擇什麼都不做或自己動手』的慣性習慣"]}, {"title": "競爭者分析的三大關鍵提問", "desc": "知彼知己才能找到破局點", "points": ["1. 對手最核心的優勢是什麼？（品牌知名度？規模經濟？通路覆蓋？）", "2. 對手在服務過程中忽略了哪些消費者的抱怨或妥協？", "3. 當我們推出新服務時，對手最可能採取何種反制手段？我們該如何因應？"]}]}, {"num": 6, "type": "3card", "tag": "貼近市場心理", "title": "讓分析貼近市場的心理與行為：消費者動機分析架構（曾光華教授觀點）", "subtitle": "行銷決策必須建立在深刻理解消費者心理的基礎之上", "cards": [{"title": "目標客群的人口統計特徵", "desc": "勾勒目標受眾的外在基本輪廓", "points": ["基本背景：年齡、性別、就讀科系、居住狀態（住宿生 vs 通勤生）", "支配預算：每週可自由支配的生活費範圍與消費主力時段", "數位足跡：主力使用的社群平台（IG、Threads、Dcard）"]}, {"title": "購買動機與追求的深層利益", "desc": "顧客購買的不是產品本身，而是問題的解方", "points": ["功能性利益：省時間、省金錢、方便取得、減少出錯風險", "心理情感利益：獲得同儕認同、展現獨特品味、減少焦慮與不確定感", "社會象徵利益：支持在地小農、展現環保理念、參與社群共同體"]}, {"title": "購買決策中的顧慮與摩擦阻力", "desc": "找出阻礙消費者立即下單的關鍵心防", "points": ["信任風險：這家微型服務可靠嗎？我的預付款或個資安全嗎？", "操作門檻：註冊會不會太麻煩？介面直覺好用嗎？", "企劃解方：以極簡透明的網頁原型與零門檻保障消除顧慮"]}]}, {"num": 7, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 輔助外部環境研究：高效蒐集次級情報與情緒缺口挖掘", "subtitle": "企劃人員的超級情報助理，快速彙整海量公開市場資訊", "cards": [{"title": "1. 快速檢索 PESTC 總體趨勢", "desc": "利用 AI 檢索國內外權威趨勢與政策脈絡", "points": ["提示詞設計：『請彙整近兩年台灣大專院校校園周邊餐飲外送與自煮趨勢之統計與政策法規……』", "情報過濾：快速識別關鍵數據亮點，提煉出對小組企劃最有利的市場切入時機", "節省 80% 的繁瑣手動搜尋時間，專注於深度洞察"]}, {"title": "2. 爬梳社群評論與真實抱怨", "desc": "將各大論壇的抱怨文本轉化為商機洞察", "points": ["貼入評價文本：將校園社團或 Google Maps 評論摘要提供給 AI", "情感分析：要求 AI 提取消費者最常提及的負面形容詞與痛點場景", "提煉真需求：從顧客的憤怒與抱怨中，看見現有市場方案的致命弱點"]}, {"title": "3. 撰寫具備五感體驗的企劃微故事", "desc": "引導 AI 產出引人入勝的企劃背景開場", "points": ["告別生硬說理：指令要求『請以第一人稱視角，描繪一位萬能大一新生在雨天中午排隊買便當的五感挫折……』", "注入情感共鳴：為後續的商業解決方案鋪陳扣人心弦的出場舞台", "企劃人員嚴格把關：潤飾微調，確保情境真實符合校園日常"]}]}, {"num": 8, "type": "content", "tag": "課堂分組實作挑戰", "title": "課堂實作工作坊：繪製小組《PESTC 外部機會與威脅矩陣》並撰寫企劃背景微故事", "content": "【各組實作步驟】：\n1. 【PESTC 快速盤點】：針對小組題目，列出 2 項有利的外部機會（O）與 1 項外在潛在威脅（T）。\n2. 【鎖定目標客群】：清楚描述你們的核心 TA 是一群什麼樣的人？他們買單的核心利益是什麼？\n3. 【撰寫微故事】：運用課堂介紹的『微故事法』，撰寫一段 150 字內的專案企劃背景（包含時間、場景、五感體驗與真實挫折）。\n4. 小組完成後上傳至數位工作表，教師現場連線大螢幕展示點評！"}]}, {"week_num": 5, "module": "模組二：精實商業推演與創意激發", "title": "內部環境分析：優劣勢檢核、定位導向與 SWOT 交叉策略推演", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ SWOT 策略", "title": "內部環境分析：優劣勢檢核、定位導向與 SWOT 交叉策略推演", "subtitle": "知己才能發揮優勢提升執行力 ｜ 優劣勢檢核表 ｜ 誠實客觀定位 ｜ SO / ST / WO / WT 行動矩陣", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "商業盲點案例破題", "title": "案例警惕：麥當勞若想賣『台式桶裝炸雞』，這究竟是優勢還是劣勢？", "quote": "「許多人以為，麥當勞擁有強大的連鎖通路、充沛的資金與頂級品牌力，想要跨足賣台式炸雞一定是絕對優勢。然而從消費者心理與定位視角來看：大家去麥當勞是為了漢堡薯條與快速標準化；若麥當勞賣起台式桶裝炸雞，消費者立刻會聯想到肯德基或街頭排隊名店，甚至質疑麥當勞『不夠道地、失去自我』。優劣勢不是絕對的，必須放在特定情境、面對特定競爭者並從消費者真實感受來誠實檢視！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 4 章定位思維"}, {"num": 3, "type": "3card", "tag": "內部分析核心目的", "title": "為什麼要徹底分析內部環境？三大提升執行力的關鍵理由", "subtitle": "知己知彼百戰不殆，清楚自身斤兩才能將有限資源發揮到極致", "cards": [{"title": "1. 發揮自身優勢，改善關鍵劣勢", "desc": "企業若不清楚長短處，往往做出自殺式決策", "points": ["聚焦核心強項：將 80% 的資源投入於團隊最具競爭力之處", "補強致命破口：及時發現技術、資金或通路短板，避免行銷到一半翻車", "掌握市場機會：用自身最鋒利的矛，刺向市場最薄弱的環節"]}, {"title": "2. 減少內部阻礙，大幅提升執行力", "desc": "企劃若脫離組織現實，各部門將陽奉陰違", "points": ["照顧各方承載力：確認現場人員與各單位確實具備配合執行的能力", "增進同理共識：主管與各單位感受到企劃尊重其處境，執行更順暢", "降低溝通摩擦：提早解決預算爭議與權責劃分不清之難題"]}, {"title": "3. 促進資源整合與日後跨界合作", "desc": "盤點各項隱形資產，化被動為主動", "points": ["盤點可用資產：校內場地、指導老師人脈、組員專業技能、校友資源", "創造綜效：將分散的小資源組裝成具備市場衝擊力的大力量", "為長期微型創業打下穩固基礎"]}]}, {"num": 4, "type": "4card", "tag": "優劣勢檢核要項", "title": "內部環境優劣勢檢核表（曾光華教授四大構面架構）", "subtitle": "全面盤點團隊內部健康度，客觀評估真實戰力", "cards": [{"title": "1. 行銷力檢核", "desc": "品牌影響力、定價彈性與通路推廣能力", "points": ["品牌知名度與美譽度如何？", "社群文案與內容傳播感染力？", "是否掌握直接觸及客群的高頻管道？"]}, {"title": "2. 研發與產品力檢核", "desc": "產品創新速度、獨特性與服務體驗品質", "points": ["產品相較於同業是否有鮮明特色？", "原型製作與迭代改進的速度有多快？", "是否具備難以被輕易複製的巧思？"]}, {"title": "3. 營運與執行力檢核", "desc": "作業流程順暢度、交付品質與彈性應變", "points": ["履約交付流程是否簡短敏捷？", "遭遇突發客訴時的應變機制？", "成本結構是否足夠輕量？"]}, {"title": "4. 團隊組織與財務力檢核", "desc": "成員技能互補、向心力與週轉資金安全", "points": ["團隊分工是否明確？是否有跨領域互補？", "初期運作資金是否充裕？", "成員對專案願景的投入度與熱忱？"]}]}, {"num": 5, "type": "2card", "tag": "內部分析原則", "title": "優劣勢判斷的兩大黃金原則：【競爭情境比較】與【消費者角度檢視】", "subtitle": "嚴禁關在冷氣房裡自我膨脹，必須禁得起市場殘酷檢驗", "cards": [{"title": "原則一：優劣勢是和主要競爭者『相對比較』的結果", "desc": "沒有孤立的優勢，只有比對手做得更好的長處", "points": ["相對性思維：你自認『服務親切』，但如果競爭對手更熱情且提供免費到府，那你的親切就不是優勢", "情境相依：高定價在小資市場是劣勢，但在精品送禮情境卻是彰顯尊榮的優勢", "客觀校對：永遠列出主要假想敵，進行指標逐項對比"]}, {"title": "原則二：必須誠實從『消費者角度』看待自己", "desc": "內部人員自豪的特點，顧客可能根本不在乎", "points": ["避免自以為是：團隊花了三週手繪的吉祥物，顧客可能只關心便當能不能準時送到", "站在買方立場：消費者願意為這項特色多花 10 元或多等 5 分鐘嗎？", "重視真實定位：守護產品在顧客心中的清晰心智席位，不可混亂"]}]}, {"num": 6, "type": "4card", "tag": "SWOT 交叉矩陣", "title": "連結優劣勢與機會威脅：【SWOT 交叉策略矩陣】（曾光華策略思維）", "subtitle": "SWOT 不是四個孤立的格子，而是推導實戰行動方案的發動機", "cards": [{"title": "SO 策略（優勢 ✕ 機會）—— 強攻乘勝追擊", "desc": "運用自身的核心優勢，將市場外部機會極大化擴展！", "points": ["策略思維：最鋒利的矛 ✕ 最誘人的肥肉", "範例：運用團隊精通 AI Agent 快速產出網頁的優勢，搶攻校園活動即時報名系統的空白商機", "行動特徵：大膽主動出擊，搶佔市場先機"]}, {"title": "ST 策略（優勢 ✕ 威脅）—— 防禦化險為夷", "desc": "運用自身的獨特優勢，抵禦、降低或迴避外在市場威脅！", "points": ["策略思維：堅固的盾 ✕ 狂風暴雨", "範例：面臨連鎖巨頭削價競爭威脅，運用在地學長姐深厚人情味與客製化服務穩固客群", "行動特徵：強化差異化護城河，拒絕捲入價格戰"]}, {"title": "WO 策略（劣勢 ✕ 機會）—— 借力翻轉扭轉", "desc": "藉由外部大好機會或跨界合作，改善或轉移內部劣勢！", "points": ["策略思維：引進甘霖 ✕ 滋潤旱地", "範例：團隊缺乏實體店面劣勢，藉由校園推動二手市集機會，以快閃攤位結合線上預約突圍", "行動特徵：借力使力，化被動為主動"]}, {"title": "WT 策略（劣勢 ✕ 威脅）—— 避險撤退防線", "desc": "正視自身短板，嚴密防範外在威脅造成毀滅性打擊！", "points": ["策略思維：及時止血 ✕ 築起防火牆", "範例：資金極度有限且面臨食材保鮮期短威脅，果斷採取限量預購制，堅持零庫存接單生產", "行動特徵：控制曝險，確保團隊生存底線"]}]}, {"num": 7, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 模擬利害關係人：客觀壓力測試小組內部優劣勢", "subtitle": "告別當局者迷的偏誤，引入客觀第三方的嚴苛審查", "cards": [{"title": "1. 扮演挑剔顧客（挑剔視角）", "desc": "讓 AI 模擬不同消費族群的真實挑剔反饋", "points": ["情境設定：『請扮演一位每個月只有 4,000 元零用錢的精打細算大一學生，請挑出我們服務的 3 個不合理缺點』", "逼出真盲點：發現團隊自認的『超值亮點』在學生眼中可能毫無吸引力", "重新校正產品價值主張"]}, {"title": "2. 扮演老牌競爭者（反制視角）", "desc": "模擬主要對手可能採取的圍剿戰術", "points": ["情境設定：『請扮演校門口經營 20 年的影印老店老闆，面對我們推出的數位預約，你會如何反制？』", "推演防禦方案：提前在企劃書中準備好因應對策，讓提案具備高度抗風險性", "增進對主管與評審的說服力"]}, {"title": "3. 輔助推演 SWOT 交叉組合", "desc": "激發出意料之外的跨維度行動策略", "points": ["輸入 S、W、O、T 清單，要求 AI 探索 5 組非常規的 WO 與 ST 組合", "打破思維框架：發現看似毫無關聯的優勢與威脅之間的策略連結", "企劃人員保有最終決策權，精選出最強的 2 組核心行動方案"]}]}, {"num": 8, "type": "content", "tag": "課堂分組實作挑戰", "title": "課堂實作工作坊：繪製小組專案的《SWOT 交叉行動矩陣表》", "content": "【各組實戰產出】：\n各組請依據目前微型創業構想，完成以下矩陣推演：\n1. 【誠實條列】：列出團隊最強的 2 項優勢（S）與最致命的 2 項劣勢（W）。\n2. 【結合外部分析】：帶入上週產出的 2 項機會（O）與 1 項威脅（T）。\n3. 【推導核心策略】：具體寫出一項【SO 強攻策略】與一項【WT 避險防禦策略】。\n4. 各組成果將作為第 9 週【期中商業提案報告】之關鍵策略核心！"}]}, {"week_num": 6, "module": "模組二：精實商業推演與創意激發", "title": "激發行銷企劃創意（上）：逆向假設分析法、全新情境法與加減乘除移五法", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 創意發想", "title": "激發行銷企劃創意（上）：逆向假設分析法、全新情境法與加減乘除移五法", "subtitle": "打破心智枷鎖 ｜ 影響創意的三大因素 ｜ 挑戰習以為常的假設 ｜ AI 跨界角色碰撞", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "創意思維啟發破題", "title": "創意思考提問：誰規定餐廳一定要有椅子？誰說吃火鍋只能選一種湯頭？", "quote": "「當所有人都認為『開餐廳必須準備舒服的椅子』時，立吞居酒屋與立食牛排誕生了，翻桌率提高三倍且價格更親民；當所有人都認為『火鍋就是一整鍋相同湯底』時，鴛鴦鍋與四宮格火鍋席捲了全球華人市場。真正的企劃創意，不是憑空等待雷電般的靈感，而是掌握有系統的思維技術，大膽挑戰常規假設！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 5 章創意心法"}, {"num": 3, "type": "3card", "tag": "創意三大支撐因素", "title": "影響行銷企劃創意的三大核心因素（曾光華教授創造力模型）", "subtitle": "企劃人如何源源不絕產出高品質的精彩構想？", "cards": [{"title": "1. 心理特質（Mindset）", "desc": "正面心理能大幅提升資訊處理的廣度與彈性", "points": ["強烈好奇心：對身邊日常細節保持敏銳觀察，探問『為什麼不能改變？』", "容忍模糊與不確定：在構想初期不急於評判是非，允許荒謬的想法存在", "冒險與玩心：視企劃為一場好玩的探索遊戲，敢於打破常規框架"]}, {"title": "2. 專業職務知識（Core Knowledge）", "desc": "紮實的本業深度是創意的地基", "points": ["熟悉產品與製程：清楚知道產品的物理極限、成本結構與交付流程", "深諳目標市場心理：對目標客群的情緒開關瞭若指掌", "掌握行銷工具演進：靈活運用各種推廣管道與數位工具"]}, {"title": "3. 周邊跨界資訊（Peripheral Knowledge）", "desc": "90% 的原創好點子，來自本業之外的意外連結", "points": ["跨領域涉獵：藝術策展、心理學、建築空間、傳統民俗文化、電競遊戲", "借石攻玉：將完全無關領域的規則或儀式感，移植到傳統商品企劃中", "豐厚生活體驗：熱愛生活、體驗不同文化，為大腦積累靈感素材庫"]}]}, {"num": 4, "type": "2card", "tag": "創意思考技術一", "title": "創意思考技術（一）：【逆向假設分析法（Reverse Assumption）】", "subtitle": "找出平日習以為常的假設，然後有條理地將其顛倒、推翻或抽離", "cards": [{"title": "逆向假設的執行三步驟", "desc": "挑戰思考盲點的系統化流程", "points": ["步驟 1【列舉假設】：列出該產品或服務平日所有被視為『理所當然』的常規特徵", "步驟 2【顛倒假設】：針對每一條假設強制問一句：『如果完全顛倒過來，會發生什麼事？』", "步驟 3【重構價值】：思考這個顛倒後的瘋狂想法，能為哪一群特定顧客解決獨特痛點？"]}, {"title": "生活中的逆向假設經典實證", "desc": "常規被推翻後誕生的成功商業模式", "points": ["傳統假設：旅館房間一定要有接待大廳與服務櫃檯 ➜ 顛倒：無人自助旅店、Airbnb", "傳統假設：看電影一定要買票進封閉黑盒子電影院 ➜ 顛倒：露天汽車電影院、星空草地放映會", "傳統假設：書店一定要販售熱門暢銷書 ➜ 顛倒：日本『一週只賣一本書』的森岡書店"]}]}, {"num": 5, "type": "4card", "tag": "逆向假設結合五法", "title": "逆向假設結合【加、減、乘、除、移】五大基本技巧（曾光華創意公式）", "subtitle": "具備強大實戰操作性的創意推演工具", "cards": [{"title": "結合 ＋ 法（增添元素）", "desc": "顛覆純粹性，加入意料之外的附加功能", "points": ["常規：服裝走秀只能純粹模特兒在伸展台『走著秀』嗎？不一定！", "顛覆創意：走秀結合現代舞劇、立體投影與現場料理實演，成為沉浸式藝術節"]}, {"title": "結合 － 法（簡化剔除）", "desc": "大膽刪除看似核心的組件，創造極致簡約", "points": ["常規：餐廳一定要有椅子？不一定！", "顛覆創意：站著吃燒肉、站著喝立吞咖啡，消除空間壓迫感並創造極高翻桌率"]}, {"title": "結合 ✕ 法（異業相乘）", "desc": "將原本各自獨立的事物綑綁結合", "points": ["常規：瑞士刀、哨子、手電筒只能分開買嗎？不一定！", "顛覆創意：戶外求生多功能工具卡，一次滿足多種極端場景"]}, {"title": "結合 ÷ 法 ＆ ↗ 移法", "desc": "切割既有事物，或轉移至全新時空場景", "points": ["÷ 法（分割）：吃火鍋只能享用一種湯頭？不一定！分割出鴛鴦與四宮格！", "↗ 法（轉移）：迎新一定要在室內？移到營火草地或數位虛擬實境世界！"]}]}, {"num": 6, "type": "3card", "tag": "創意思考技術二", "title": "創意思考技術（二）：【全新情境法（New Context Method）】", "subtitle": "為平日熟悉的事物想像一個全新場景，從中激發突破性構想", "cards": [{"title": "全新情境 ✕ ＋法 / －法", "desc": "如果在完全不同的情境下，該有多好？", "points": ["＋法情境：「如果旅館房間有望遠鏡，該有多好！」➜ 打造觀星主題天文旅宿", "－法情境：「如果吸塵器可以自己吸塵而不用人推，該有多好！」➜ 掃地機器人誕生", "思維啟發：從使用者的生活遺憾與美好幻想中找尋切入點"]}, {"title": "全新情境 ✕ ✕法（異質融合）", "desc": "將兩種互不相干的生活片段重疊", "points": ["情境發想：「如果能一邊通勤搭捷運，一邊完成洗衣服或微學習，該有多好！」", "商業成果：捷運站智慧寄取洗衣櫃、通勤 5 分鐘聽書音頻 APP", "核心價值：為現代人奪回被碎片化浪費的零碎時間"]}, {"title": "全新情境 ✕ ↗法（場景置換）", "desc": "將熟悉的活動搬遷到意料之外的空間", "points": ["情境發想：「如果能把企管課堂直接搬進知名企業的戰情會議室，該有多好！」", "商業成果：微型企業實務參訪式工作坊、露天沙灘上的創業路演日", "核心價值：打破空間沈悶感，全面激活參與者的五感能量"]}]}, {"num": 7, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以多 Agent 角色碰撞（Persona Collision）極速打破心智枷鎖", "subtitle": "讓 AI 扮演極端反常規角色，強行踢出思維舒適圈", "cards": [{"title": "1. 激進挑戰者 Agent（The Contrarian）", "desc": "專門負責挑釁所有理所當然的常識", "points": ["提示詞指令：『請找出我們專案中的 3 個理所當然的假設，並用最極端、最荒謬的方式反轉它們！』", "逼出新視角：打破團隊內部的盲目從眾與慣性思維", "發現隱藏藍海：將荒謬構想重新拉回商業可行性評估"]}, {"title": "2. 跨界移植者 Agent（The Cross-Pollinator）", "desc": "負責將完全無關領域的規則移植過來", "points": ["提示詞指令：『請將《米其林三星餐廳》的服務儀式感，移植到我們的大學二手書媒合服務中！』", "激盪結果：每一本書附上『閱讀品味鑑定卡』與專屬封口蠟印，大幅提升情感溢價", "創造令人驚豔的品牌差異化記憶點"]}, {"title": "3. 企劃人的審美與價值定錨", "desc": "在天馬行空中保持清醒的商業直覺", "points": ["AI 負責擴散千萬種可能，人類負責挑選最具情感共鳴的種子", "嚴格檢核：這個創意是否能真正解決目標客群的痛點？", "將優質創意轉化為後續產品規格與行銷亮點"]}]}, {"num": 8, "type": "content", "tag": "課堂分組創意思考實作", "title": "課堂實作工作坊：運用【逆向假設 ✕ 加減乘除移】為小組專案激發 3 個驚喜點子", "content": "【各組 15 分鐘極速發想挑戰】：\n1. 【寫下假設】：針對小組微型創業題目，寫出 1 個大家認為『本來就該這樣做』的傳統常規。\n2. 【逆向顛覆】：用『不一定！如果完全相反……』開始造句。\n3. 【套用公式】：選擇加、減、乘、除、移其中一種技巧，設計出一個前所未見的全新服務特色！\n4. 小組評選出最具震撼力的一項，由代表上台接受全班投票票選『本日最佳腦洞獎』！"}]}, {"week_num": 7, "module": "模組二：精實商業推演與創意激發", "title": "激發行銷企劃創意（下）：六頂思考帽、團隊腦力激盪與避開兩大創意陷阱", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 團隊決策", "title": "激發行銷企劃創意（下）：六頂思考帽、團隊腦力激盪與避開兩大創意陷阱", "subtitle": "團隊創造力機制 ｜ 六頂思考帽色彩特性 ｜ 避開忽略理性紀律與盲目狂歡陷阱 ｜ 創意檢驗標準", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "團隊溝通痛點破題", "title": "會議室裡的典型噩夢：為什麼每次團隊腦力激盪，最後都變成吵架或沈默？", "quote": "「行銷小組開會討論新點子。A 同學剛興奮地拋出一個跨界構想，B 同學立刻潑冷水：『這成本太高了根本不可行！』C 同學說：『我直覺這點子很爛。』A 同學深感挫折從此閉嘴……大家在同一個時間點，有人用情感批判、有人用成本打壓、有人憑空想像。這種混亂的思維打架，正是抹殺團隊創造力的頭號元凶！」", "author": "—— 思考大師 愛德華·狄波諾（Edward de Bono）六頂思考帽創立緣由"}, {"num": 3, "type": "2card", "tag": "團隊腦力激盪原則", "title": "團隊激發創意方法一：【腦力激盪術（Brainstorming）的黃金原則】", "subtitle": "鼓勵海闊天空的發想，但嚴格忌諱漫無目的的閒聊！", "cards": [{"title": "腦力激盪的四大不敗守則", "desc": "創造安全且高產出的討論場域", "points": ["1.【延遲評判（Defer Judgment）】：發想階段嚴禁批評任何點子，即便荒謬也先記錄", "2.【追求數量（Go for Quantity）】：先有量才有質，前 20 個通常是常規，第 50 個才見精華", "3.【搭便車與組合（Piggyback）】：鼓勵借用他人點子進行延伸、嫁接與改造升級", "4.【歡迎奇思妙想（Welcome Wild Ideas）】：愈瘋狂的點子，愈容易激盪出前所未見的洞見"]}, {"title": "如何避免淪為『無目的閒聊』？", "desc": "嚴格設定框架與產出目標", "points": ["設定明確問題邊界：不討論『如何拯救地球』，只討論『如何讓雨天外送快 10 分鐘』", "嚴格限時倒數：每輪發想限制 8~10 分鐘，製造時間壓力激發潛能", "專人視覺化記錄：將每個點子即時寫在便利貼或線上白板上，所有人清晰可見"]}]}, {"num": 4, "type": "3card", "tag": "六頂思考帽解析", "title": "團隊激發創意方法二：【六頂思考帽（Six Thinking Hats）】色彩密碼（一）", "subtitle": "引導全組在同一時刻看向同一個思維方向，終結無效爭吵", "cards": [{"title": "白帽（White Hat）—— 客觀數據與事實", "desc": "像中立的電腦，只專注於客觀資料與資訊缺口", "points": ["關鍵提問：我們目前掌握了哪些確鑿的數據？我們還缺少什麼資訊？", "思維特徵：拋開個人喜好與推測，只看政府統計、市調報告與實際測試數字", "運用時機：開會初期盤點現況，或驗收期核對預算與成效"]}, {"title": "紅帽（Red Hat）—— 直覺、情感與預感", "desc": "合法釋放感性情緒，不需提出任何理由或藉口", "points": ["關鍵提問：直覺告訴你這個方案吸引人嗎？你心中有什麼擔憂或興奮？", "思維特徵：行銷是高度感性的體驗，第一眼的好惡往往代表目標受眾的直覺反應", "運用時機：簡短快速（每人 30 秒），捕捉最真實的第一線心態"]}, {"title": "黑帽（Black Hat）—— 謹慎、批判與風險防禦", "desc": "扮演嚴格的法官，挑出潛在缺陷與法律安全漏洞", "points": ["關鍵提問：這個方案哪裡最容易失敗？會不會違法？我們承擔得起虧損嗎？", "思維特徵：邏輯嚴密的反思，避免盲目樂觀帶來的致命災難", "運用時機：在方案收斂與執行規劃前，進行極限壓力測試"]}]}, {"num": 5, "type": "3card", "tag": "六頂思考帽解析", "title": "團隊激發創意方法二：【六頂思考帽（Six Thinking Hats）】色彩密碼（二）", "subtitle": "從希望收益、突破性創意到全流程精準控管", "cards": [{"title": "黃帽（Yellow Hat）—— 樂觀、價值與效益探索", "desc": "像陽光般尋找構想背後的美好遠景與商業利益", "points": ["關鍵提問：這個點子最迷人的價值在哪？如何把它的效益放大十倍？", "思維特徵：積極探尋哪怕只有 1% 的成功機會，建立團隊前進的信心", "運用時機：評估看似瘋狂的構想時，先戴黃帽發掘其潛力，再戴黑帽挑錯"]}, {"title": "綠帽（Green Hat）—— 創意、發散與全新替代方案", "desc": "像春天發芽的種子，探索一切非傳統的可能性", "points": ["關鍵提問：如果預算為零，還有什麼替代方法？如何克服黑帽挑出的困難？", "思維特徵：運用加減乘除移五法，不斷產生全新的替代選項", "運用時機：突破僵局與尋找差異化亮點的核心發動機"]}, {"title": "藍帽（Blue Hat）—— 流程掌控、指揮與結論統籌", "desc": "像樂團指揮家，掌控思考的節奏與遊戲規則", "points": ["關鍵提問：我們現在該換戴哪一頂帽子？今天會議達成了什麼具體結論？", "思維特徵：跳出內容本身，專注於引導會議流程與分配發言順序", "運用時機：由組長或會議主持人自始至終佩戴，定錨討論焦點"]}]}, {"num": 6, "type": "2card", "tag": "創意警惕陷阱", "title": "避開創意對行銷企劃的【兩大致命陷阱】（曾光華教授鄭重提醒）", "subtitle": "創意是企劃的靈魂，但也可能是讓企劃粉身碎骨的萬丈深淵", "cards": [{"title": "陷阱一：忽略理性與紀律的重要性（缺乏紮實落地）", "desc": "只有好點子卻沒有執行紀律，永遠無法產出商業成果", "points": ["盲目狂歡後的一地雞毛：團隊通宵想出驚豔點子，隔天卻沒人願意排甘特圖、寫文案或算成本", "大師指引：好點子需要【高度理性態度】與【嚴格紀律】才能徹底落實！", "檢驗標準：再美妙的創意，若無法在指定時間與預算內驗收，就是不及格企劃"]}, {"title": "陷阱二：只求自身爽快而忽略了市場與消費者（閉門造車）", "desc": "陷入創作者自我陶醉，脫離消費者的真實生活情境", "points": ["常見盲點：團隊覺得自己酷炫無比，但消費者覺得不知所云或帶來多餘負擔", "大師指引：創意要考慮到目標市場的感受、理解能力與真實反饋！", "檢驗標準：創意必須為顧客創造可感知的價值，而非企劃人員的自娛自樂"]}]}, {"num": 7, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 扮演嚴苛黑帽與客觀白帽：杜絕團隊盲目樂觀", "subtitle": "最稱職的理性陪練員，隨時為團隊提供客觀數據與冷酷質疑", "cards": [{"title": "1. 召喚『終極黑帽 Agent』", "desc": "專門挑剔方案中的邏輯漏洞與執行死角", "points": ["提示詞：『請以最挑剔的投資人黑帽視角，列出這份企劃最可能導致失敗的 3 個隱藏風險！』", "防患未然：在期中報告前主動堵住所有可能被評審質疑的破口", "讓企劃方案變得堅不可摧"]}, {"title": "2. 召喚『客觀白帽 Agent』", "desc": "自動檢核方案中缺乏數據支撐的論述", "points": ["提示詞：『請檢查以下企劃草案，標註出哪些結論純屬主觀臆測，並建議應補充何種客觀統計數據。』", "強化邏輯支柱：自動標出需要查證的事實，大幅提升企劃書說服力"]}, {"title": "3. 企劃人的綜合藍帽決策", "desc": "駕馭 AI 提供的情資，做出成熟的商業抉擇", "points": ["平衡黑帽的謹慎與綠帽的冒險，不因風險而裹足不前，也不因熱情而盲目盲從", "帶領團隊產出禁得起市場考驗的紮實企劃案"]}]}, {"num": 8, "type": "content", "tag": "課堂六頂思考帽演練", "title": "課堂實作工作坊：小組輪流切換【六頂思考帽】現場推演企劃亮點", "content": "【15 分鐘全班同步演練】：\n1. 【藍帽主持】：由組長佩戴藍帽，宣布會議主題與時間掌控規則。\n2. 【綠帽狂發】：全組 3 分鐘，為專案服務發想 3 個破壞式新功能。\n3. 【黃帽找亮點】：全組 2 分鐘，列出這些功能最吸引人的商業利益。\n4. 【黑帽挑缺陷】：全組 3 分鐘，無情挑出可能的法律、成本或執行盲點。\n5. 【白帽補數據】：確認需要補充哪些數據以驗證可行性。\n6. 各組記錄下最終定案的核心亮點，準備融入期中商業企劃書！"}]}, {"week_num": 8, "module": "模組二：精實商業推演與創意激發", "title": "新產品上市行銷企劃（上）：創新層次、成敗關鍵與 STP 4P 整合架構", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 上市架構", "title": "新產品上市行銷企劃（上）：創新層次、成敗關鍵與 STP 4P 整合架構", "subtitle": "不創新便死亡 ｜ 四類新產品創新層次 ｜ 新產品成敗關鍵 ｜ STP 目標市場與定位 ｜ 4P 策略整合", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "商業現實震撼破題", "title": "殘酷的市場定律：每年成千上萬新產品上市，為什麼高達 80% 默默夭折？", "quote": "「企業界常說：『不創新，便死亡！』但更殘酷的真相是：『盲目創新，死得更快！』市面上超過八成的新產品在上市一年內悄然下架。失敗的關鍵往往不是技術做不出來，而是：沒有真正搞清楚這是哪一類創新、沒有給消費者足夠的試用誘因、定價與定位自相矛盾、或者行銷 4P 互相打架。新產品上市是一場縝密的系統作戰！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 6 章開篇警示"}, {"num": 3, "type": "4card", "tag": "新產品四類創新層次", "title": "何謂新產品？四大創新層次與消費者行為改變幅度（曾光華分類模型）", "subtitle": "創新的幅度不同，消費者面臨的學習門檻與行銷策略截然不同", "cards": [{"title": "1. 革命性創新（非連續性）", "desc": "前所未有的全新發明與使用方式", "points": ["產品特徵：伴隨全新產品類別名稱誕生（如個人電腦、智慧型手機、生成式 AI）", "客群門檻：消費者必須學習全新的知識與操作習慣", "行銷策略重點：長期教育市場、建立認知與克服使用恐懼"]}, {"title": "2. 改良式創新（動態連續性）", "desc": "大幅改變現有產品的功能或體驗方式", "points": ["產品特徵：不需改變核心目的，但調整了操作步驟（如電子紙閱讀器、掃地機器人、純電車）", "客群門檻：消費者需輕微調整生活慣性", "行銷策略重點：強調大幅升級的生活便利性與使用價值"]}, {"title": "3. 局部改變產品（連續性）", "desc": "幅度微小，消費者完全不需要改變習慣", "points": ["產品特徵：新口味、新包裝、增量版（如零卡可樂、大容量無糖綠茶）", "客群門檻：零學習成本，隨拿隨用", "行銷策略重點：藉由高頻促銷、搶眼貨架陳列刺激衝動性購買"]}, {"title": "4. 新形象與新定位產品", "desc": "產品本質改變不大，但賦予全新心智席位", "points": ["產品特徵：重新定義使用場景與情感價值（如傳統保溫瓶變為時尚街拍單品）", "客群門檻：改變對品牌的心理認知與社會象徵認同", "行銷策略重點：公關事件行銷、KOL 穿搭演繹與社群美學重塑"]}]}, {"num": 4, "type": "3card", "tag": "上市企劃核心架構", "title": "新產品上市企劃的三大核心支柱：目標市場、產品定位與行銷組合整合", "subtitle": "曾光華教授新產品上市企劃方案標準架構", "cards": [{"title": "支柱一：清晰精準的目標市場（STP）", "desc": "清楚指認誰是第一批願意為你買單的先驅者", "points": ["避免貪多嚼不爛：嚴禁定義目標市場為『全台灣所有人』", "明確特徵描述：年齡、生活作息、最在意的價值、購買預算限制", "選擇理由充分：說明為什麼這群人面臨最迫切的痛點、最容易被觸動"]}, {"title": "支柱二：鮮明銳利的產品定位（Positioning）", "desc": "在目標顧客心智中佔領獨一無二的專屬席位", "points": ["與競爭者清晰對比：我們做得更好的地方究竟是什麼？", "支撐定位的屬性：憑藉哪項獨特功能帶來哪項顧客利益？", "定位的一致性：定位一旦確立，後續定價、文案與通路絕不可自相矛盾"]}, {"title": "支柱三：整合協調的行銷策略（4P 綜效）", "desc": "產品、定價、通路與推廣緊密配合、產生綜效", "points": ["產品（Product）：聚焦核心 MVP，以最精簡功能驗證核心價值", "價格（Price）：配合定位，不輕易打削價戰傷害品牌品質感", "通路與推廣（Place & Promotion）：線上單頁網站無縫串聯社群擴散"]}]}, {"num": 5, "type": "3card", "tag": "上市消費者反應階段", "title": "新產品上市的階段性目標階梯（曾光華行銷傳播層次理論）", "subtitle": "消費者從陌生到購買的心理轉化六部曲", "cards": [{"title": "階段一：知名度與理解（認知層）", "desc": "讓市場知道你的存在，並弄懂你在賣什麼", "points": ["知名度（Awareness）：透過話題事件與吸睛視覺在目標圈層引發討論", "理解度（Comprehension）：用 10 秒鐘大白話講清楚產品到底解決什麼問題", "關鍵避坑：避免使用生僻技術術語，多用具體生活情境對比"]}, {"title": "階段二：好感與偏好（情感層）", "desc": "讓消費者產生好感，並在眾多選擇中優先考慮你", "points": ["好感度（Liking）：傳遞溫暖品牌理念與認同感（如支持在地小農）", "偏好度（Preference）：透過第三方口碑、同儕評價建立信任護城河", "關鍵避坑：重視品牌調性與設計美感，杜絕廉價感排版"]}, {"title": "階段三：試用與購買（行動層）", "desc": "打破最後一公里的心防，促成首次下單體驗", "points": ["試用誘因（Trial）：小包裝體驗組、免運費試吃、線上免費原型預覽", "促成購買（Adoption）：極簡付款動線、限時預購優惠、滿意保證機制", "關鍵指標：追蹤真實預約筆數與回購留存率"]}]}, {"num": 6, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 輔助新產品上市推演：從價值主張畫布到單頁 MVP 規格", "subtitle": "企劃方案不再紙上談兵，迅速轉譯為可驗證的原型網頁規格", "cards": [{"title": "1. 對齊價值主張畫布（VPC）", "desc": "確保產品解方與痛點 100% 緊密扣合", "points": ["輸入顧客痛點（Pains）與渴望獲得（Gains）", "要求 AI 嚴格檢視產品的痛點解方（Pain Relievers）是否對症下藥", "剔除與核心痛點無關的冗餘功能，保持輕盈敏捷"]}, {"title": "2. 擬定單頁 MVP 網頁架構草圖", "desc": "規劃能夠讓大眾點擊測試的微型商業網站", "points": ["五大黃金區塊：現代導航列、強烈 Hero 標語、3 大核心賣點、透明方案、預購行動按鈕", "將抽象的 4P 策略轉譯為具体的網頁視覺與文字規格", "為下半學期的 Antigravity 實戰建置奠定完美藍圖"]}, {"title": "3. 企劃評核四大標準自我預審", "desc": "在期中報告前進行全方位健康檢查", "points": ["依據曾光華教授四大維度（邏輯、創意、執行力、效益）逐項審視小組企劃書", "主動修正矛盾之處，做好迎接下週正式提案發表的充分準備"]}]}, {"num": 7, "type": "content", "tag": "期中提案倒數準備", "title": "課堂實作工作坊：盤點小組《新產品上市企劃核心卡》並鎖定下週發表要項", "content": "【下週【期中商業提案發表】最後衝刺檢核】：\n各組請於課堂完成企劃書最後統整：\n1. 【新產品創新層次】：確認小組專案屬於哪一類創新？目標客群的習慣改變幅度有多大？\n2. 【STP 與 4P 對齊】：確認目標市場、產品定位、定價與推廣策略完全一致，無矛盾之處。\n3. 【預期成效量化】：寫出上線後前 3 個月預計達成的階段性量化指標（如人數、筆數）。\n4. 各組確認下週【3分鐘精實口頭發表】之投影片與報告分工！"}]}, {"week_num": 9, "module": "模組二：精實商業推演與創意激發", "title": "【期中報告】精實商業提案發表（Lean Pitch）與同儕互評", "slides": [{"num": 1, "type": "title", "tag": "期中里程碑 ✕ 商業競演", "title": "【期中報告】精實商業提案發表（Lean Pitch）與曾光華四大維度同儕審查", "subtitle": "微型創業企劃總驗收 ｜ 3 分鐘精實提案 ｜ 曾光華四大評核維度 ｜ 線上即時同儕互評", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "提案核心心態破題", "title": "提案發表座右銘：任務不是『流水帳報告』，而是『爭取認同與說服買單』！", "quote": "「站上講台，台下的聽眾不是來聽你唸書的，評審與投資人只關心三件事：第一，你發現的痛點真的存在嗎？第二，你的解決方案真的有創意且符合邏輯嗎？第三，你們團隊真的有能力在有限預算內做出來嗎？忘掉生硬的背誦，用眼神與熱情，說服全場相信你們的微型創業值得被看見！」", "author": "—— 邱俊維 博士 期中商業提案致勉詞"}, {"num": 3, "type": "4card", "tag": "企劃審查四大維度", "title": "曾光華教授行銷企劃審查四大黃金維度（期中評分核心準則）", "subtitle": "全班同儕互評與教師審查之共同衡量天平", "cards": [{"title": "維度一：邏輯合理性（30%）", "desc": "推論是否有力？前提假設是否真實可靠？", "points": ["問題真因界定清楚，不把表面現象當成核心病灶", "外部分析與目標設定有客觀數據或訪談佐證", "STP 定位與 4P 策略前後連貫，無自相矛盾"]}, {"title": "維度二：創意新穎度（25%）", "desc": "是否具備差異化亮點與生活驚喜感？", "points": ["打破傳統框架，展現變通性與獨特性", 漏斗數字"]}]}, {"num": 7, "type": "content", "tag": "課堂案例復盤實作", "title": "課堂實作工作坊：填寫小組《專案盲點體檢與改進對策表》", "content": "【各組 15 分鐘深度體檢】：\n1. 【借鏡 LOVEpet】：誠實寫下小組專案中，哪一項功能『最可能存在技術或合作上的盲點』？\n2. 【借鏡 蘆溪 LUCY】：小組專案能否提煉出像『文化轉譯矩陣』般具有故事感的生活儀式感？\n3. 【調整行動】：列出 1 項具體的產品或定價修正方案，準備帶入後續單頁微型商業網頁建置！"}]}, {"week_num": 11, "module": "模組三：整合行銷傳播與創意實踐", "title": "公關與事件行銷企劃：創造社會大眾話題，全聯母親節策展與文化傳播案例", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 事件行銷", "title": "公關與事件行銷企劃：創造社會大眾話題，全聯母親節策展與文化傳播案例", "subtitle": "公關是企業化妝師 ｜ 事件行銷三大成功要件 ｜ 全聯超市美術館移法策展 ｜ 體驗行銷與社群擴散", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "公關魅力破題", "title": "公關經典金句：廣告是你花錢跟別人吹噓自己多好；公關是讓別人主動幫你宣傳傳奇！", "quote": "「傳統廣告在消費者眼中永遠帶著『老王賣瓜』的防備心。然而當全聯在母親節不打折促銷，而是在超市生鮮貨架上擺設高雅的『美術館級解說牌』，寫著：『展品：母親長年浸泡洗碗精的粗糙雙手……』瞬間引爆數十萬網友轉發淚崩。這就是公關與事件行銷的強大魔力：整合情感與社會話題，讓媒體爭相報導、讓消費者主動為你傳播！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 7 章經典策展案例"}, {"num": 3, "type": "3card", "tag": "公關三大訴求特色", "title": "公關是企業的化妝師：公關傳播訴求的三大不可替代特色（曾光華觀點）", "subtitle": "為什麼預算有限的微型創業團隊更應該重視公關？", "cards": [{"title": "1. 公信力高（High Credibility）", "desc": "藉由第三方媒體與口碑客觀報導", "points": ["打破商業心防：消費者對付費廣告防備心重，但對新聞報導與同儕推薦深信不疑", "權威背書效應：被校園新聞、在地自媒體或專業社群報導，瞬間建立信賴感", "長期品牌資產：優良的公關報導能持續在搜尋引擎留下永久正面的數位足跡"]}, {"title": "2. 降低防禦心理（Lower Resistance）", "desc": "以新聞故事或社會議題形式自然呈現", "points": ["不談推銷談理念：圍繞校園關懷、友善小農或環保永續等共同價值展開對話", "創造對話空間：吸引目標客群主動在社群下方留言參與討論", "將商業意圖包裝在社會善意與文化美感之中"]}, {"title": "3. 戲劇化呈現潛力（Dramatic Potential）", "desc": "以生動的事件、儀式感與反差感吸引目光", "points": ["創造視覺衝擊：例如把傳統貨架變身美術館展廳，形成強烈衝突美感", "自帶傳播基因：具備高度話題性，讓參與者忍不住拍照上傳社群（IG/Threads）", "低成本高槓桿：以巧妙的創意策展放大有限推廣預算"]}]}, {"num": 4, "type": "2card", "tag": "事件行銷成功要件", "title": "事件行銷企劃（Event Marketing）：定義與兩大成功要件", "subtitle": "整合內外部資源，創造大眾真正關心的話題", "cards": [{"title": "要件一：緊扣社會脈動與大眾心理痛點", "desc": "切忌自說自話，必須順應正在發酵的社會情緒", "points": ["搭乘話題順風車：如性別平權、長輩孤獨感、新住民二代教育、在地永續創生", "引發群體共鳴：讓大眾覺得參與這場活動是在為某種美好的價值表態", "避免生硬置入：如果商業氣息太重，社會大眾立刻失去轉發興趣"]}, {"title": "要件二：縝密規劃線上線下的雙向擴散迴路", "desc": "現場體驗只是引信，社群共振才是主戰場", "points": ["線上引流至線下（O2O）：社群預熱、發布懸念預告片，吸引大眾到現場參與", "線下反哺回線上：現場設置極具打卡美感的互動點，激發參觀者自主發文標記", "長尾效應發酵：整理活動紀錄影片與微電影，持續在社群擴散感動"]}]}, {"num": 5, "type": "3card", "tag": "經典案例深度解析", "title": "曾光華第 7 章經典案例解析：【全聯母親節美術館策展企劃】的六大亮點", "subtitle": "教科書級的事件行銷典範：打破價格促銷常規，創造極致情感共鳴", "cards": [{"title": "1. 企劃目標扣緊『隱形勞動』", "desc": "跳脫通路打折割喉戰", "points": ["洞察年輕小家庭與新世代女性對家庭勞動分工的真實心聲", "將超市日常採買昇華為『感謝母親隱形付出』的情感策展"]}, {"title": "2. 美術館移法策展（核心創意）", "desc": "將菜市場貨架轉化為高雅藝術空間", "points": ["在生鮮貨架放置高雅的『美術館級解說牌』，形成巨大反差張力", "文案極具詩意與畫面感，直擊逛超市消費者的心靈深處"]}, {"title": "3. 數位濾鏡 ✕ 實體明信片", "desc": "兼具數位擴散與紙本溫度", "points": ["開發專屬 IG 濾鏡：套用文藝色調並浮現母親感人金句", "代客郵寄明信片：保留手寫實體文字的溫度，為異鄉學子傳遞愛意"]}]}, {"num": 6, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 策劃公關事件：從社群話題矩陣到新聞稿結構化生成", "subtitle": "微型創業團隊的專屬公關智囊團，快速產出多維度傳播素材", "cards": [{"title": "1. 擬定高情感共鳴的策展文案", "desc": "學習全聯美術館級文案風格", "points": ["提示詞指令：『請為我們的校園微型創業專案，撰寫 3 組具備詩意與五感體驗的實體展示說明牌文案……』", "精雕細琢文字韻味，賦予平淡無奇的商品深刻的人文底蘊"]}, {"title": "2. 規劃 360 度社群擴散時程表", "desc": "精確劃分活動前、活動中與活動後", "points": ["活動前 7 天：發布懸念預告貼文與同儕痛點徵集", "活動當天：限時動態現場直擊、打卡贈品互動機制", "活動後 3 天：回顧影音與感動留言集錦二次發酵"]}, {"title": "3. 產出標準格式公關新聞稿", "desc": "符合校園媒體與在地自媒體收錄規範", "points": ["黃金倒金字塔結構：導言包含人事時地物五大關鍵要素", "亮點引述句（Quotes）：以創辦學生真誠心聲打動受眾", "備妥媒體聯絡窗口與高解析度照片清單"]}]}, {"num": 7, "type": "content", "tag": "課堂公關事件策劃演練", "title": "課堂實作工作坊：為小組微型創業專案設計一場【低成本、高話題】快閃事件", "content": "【各組 15 分鐘快閃事件構思】：\n1. 【事件主題命名】：為活動取一個自帶傳播話題的吸睛名稱（如『全聯母親節美術館』）。\n2. 【跨界反差亮點】：將什麼完全意料之外的元素『移』進活動中？\n3. 【社群擴散誘因】：參與者憑什麼會心甘情願拍照打卡發限動？\n4. 各組指派組員代表發表，由全班評選出『最有傳播魔力企劃』！"}]}, {"week_num": 12, "module": "模組三：整合行銷傳播與創意實踐", "title": "促銷企劃案：促銷特性、種類與防禦機制，保護品牌價值的實戰促銷設計", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 促銷防禦", "title": "促銷企劃案：促銷特性、種類與防禦機制，保護品牌價值的實戰促銷設計", "subtitle": "促銷特性與種類 ｜ 避開價格割喉戰陷阱 ｜ 屏東勝利星村購物節案例 ｜ 萊爾富銀髮族溫情促銷", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "促銷警示破題", "title": "促銷的雙面刃震撼：降價促銷就像喝鹽水解渴，越喝越渴，最後傷及筋骨！", "quote": "「在所有行銷活動中，促銷最靈活、見效最快，但也最危險！許多創業者業績一不好就搞 1 元起標或全館五折。這雖然能在短期內帶來人潮，但帶來的大多是『毫無忠誠度的便宜客』；促銷一結束，業績立刻打回原形，而原本願意出原價買的忠實顧客，反而覺得自己是冤大頭，品牌價值徹底被作賤！促銷企劃的最高境界，是讓消費者覺得賺到了驚喜，卻絕不讓品牌淪為地攤廉價品！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 8 章促銷哲學"}, {"num": 3, "type": "3card", "tag": "促銷特性與種類", "title": "促銷（Sales Promotion）的本質特性與四大常見種類（曾光華架構）", "subtitle": "在一段較短時間內用來刺激購買的專屬推廣行動", "cards": [{"title": "促銷的核心特性與價值", "desc": "高彈性、高誘因、立竿見影", "points": ["短期刺激：設定明確截止期限，創造『錯過不再』的迫切感", "提供直接附加價值：折扣、贈品、抽獎或專屬特權", "加速決策流程：打破消費者的猶豫與拖延習慣"]}, {"title": "針對消費者的常見促銷種類", "desc": "依據推廣目的選擇最適工具", "points": ["價格誘因型：折價券、滿額折抵、多件組合價（慎用，防傷品牌）", "附加價值型：買大送小、精緻限量贈品、專屬配件搭配", "體驗獎勵型：集點卡、刮刮樂、抽獎、會員專屬 VIP 預覽會"]}, {"title": "促銷的重大警惕與提醒", "desc": "不可跨越的品牌保護防線", "points": ["絕對前提：【不傷害品牌價值】！", "嚴控頻率與時機：若天天都在打折，消費者將不再相信你的原價", "慎選地點與方式：確保促銷動線與現場服務品質不打折"]}]}, {"num": 4, "type": "2card", "tag": "經典案例剖析一", "title": "案例一深度剖析：【屏東勝利星村購物節促銷企劃】的亮點與盲點診斷", "subtitle": "曾光華第 8 章經典實務案例：創意促銷與品牌保護的博弈", "cards": [{"title": "企劃精彩優點：畫面感與老派浪漫", "desc": "成功賦予商圈獨特的情境魅力", "points": ["目標具備畫面感：將眷村文化轉譯為『微光中的老派浪漫』與『午夜黑市尋寶』", "靈活運用 SWOT 交叉分析：將店家空間狹小的劣勢（W），化為發行『尋寶護照與盲盒』，引導遊客穿梭巷弄跨店探索的巨大優勢（O）"]}, {"title": "評審指出的盲點與改進建議", "desc": "跨年夜 1 元起標與荷蘭式拍賣的隱憂", "points": ["盲點：每 30 分鐘降價 15% 的荷蘭式拍賣極具噱頭，但容易吸引投機客，與歷史文創的高雅氛圍衝突", "執行匱乏：未充分考慮一線店家在跨年夜的排班與備貨承受力", "大師改進建議：設立『最低結標底價』與『單店限量』，強化文創商品的『稀缺性』以守護品牌"]}]}, {"num": 5, "type": "2card", "tag": "經典案例剖析二", "title": "案例二溫情借鏡：【萊爾富超商銀髮族促銷企劃】的人情味哲學", "subtitle": "將冷冰冰的商品折扣，昇華為『有人願意陪你過生日』的心靈溫暖", "cards": [{"title": "化門市規模劣勢為人情味優勢（SWOT 典範）", "desc": "不跟兩大龍頭比門市數量，比在地鄰里情感", "points": ["趨勢敏銳洞察：切入台灣高齡化趨勢，看見獨居長輩渴望日常問候與陪伴的深層心理缺口", "策略巧妙轉化：將萊爾富門市較小、店員與熟客關係緊密的特點，塑造為『鄰里客廳般的人情味』"]}, {"title": "充滿圖像與感覺的促銷設計", "desc": "避開品牌廉價化陷阱的模範生", "points": ["企劃核心：將生日優惠昇華為店長親自遞上的溫暖茶點與關懷問候卡", "選品智慧：結合有機燕麥、無糖營養食品等健康商品，強化專業信賴感", "三階段進度與效益評估：短期看門市營收、中期看會員黏著、長期看銀髮社群口碑"]}]}, {"num": 6, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 輔助促銷方案設計：守護利潤底線與不傷品牌的促銷玩法", "subtitle": "拒絕無腦打折，透過創意包裝打造高附加價值的促銷方案", "cards": [{"title": "1. 腦力激盪『不傷品牌的創意促銷』", "desc": "尋找除了降價以外的高吸引力誘因", "points": ["提示詞：『請為我們的校園微型創業服務，設計 3 款不降低商品定價，但能給消費者強烈超值感的促銷機制（如解鎖特權、跨界聯名禮、限量體驗）……』", "產出富有人情味與驚喜感的行銷方案"]}, {"title": "2. 促銷文案的情感化包裝", "desc": "告別大甩賣字眼，融入生活美好畫面", "points": ["將『滿 200 折 20』改寫為『今天，讓我們請你喝一杯熱咖啡，溫暖你的午後時光』", "運用文字魔力，將交易行為轉化為真誠的情感交流"]}, {"title": "3. 促銷成本效益與損益平衡精算", "desc": "確保每一分讓利都在安全利潤防線之內", "points": ["輸入預估客單價、毛利率與促銷贈品成本，由 AI 快速推演損益平衡點", "確認促銷活動能帶來實質現金流與新客留存，杜絕虧本賺吆喝"]}]}, {"num": 7, "type": "content", "tag": "課堂促銷方案設計實作", "title": "課堂實作工作坊：為小組微型創業專案設計一份【保護品牌價值】的促銷方案", "content": "【各組 15 分鐘促銷企劃】：\n1. 【促銷目的確立】：本次促銷是為了『吸引首批種子用戶試用』還是『提高客單價』？\n2. 【非降價型誘因設計】：設計一項兼具吸引力、但絕不貶低專案品質的附加價值（贈品/特權/體驗）。\n3. 【防呆與風控機制】：設定促銷的起訖時間、數量上限與參與規則，防止被投機利用。\n4. 小組完成後將方案寫入數位工作表，由教師挑選組別點評！"}]}, {"week_num": 13, "module": "模組三：整合行銷傳播與創意實踐", "title": "其他類行銷企劃：愛心同行 Pass APP、LINE 在南故宮與諸羅藝文道案例分析", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 跨域案例", "title": "其他類行銷企劃：愛心同行 Pass APP、LINE 在南故宮與諸羅藝文道案例分析", "subtitle": "非營利與跨域整合企劃 ｜ 擺脫悲情訴求 ｜ 高頻數位工具活化實體文化 ｜ 雙邊平台網絡模式", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "跨域思維破題", "title": "跨界企劃名言：行銷不只是商業賣貨，更是推動社會共好與文化復興的強大力量！", "quote": "「許多人以為行銷企劃只能用在一般消費品。但在曾光華教授的案例庫中，最令人動容的往往是跨域企劃：如何讓公益 APP 擺脫傳統賣慘悲情，轉化為融入日常消費的時尚共融平台？如何運用台灣人天天滑的 LINE，翻轉故宮南院的人流荒漠？行銷企劃的邏輯、創意與執行力，是解決複雜社會難題的最佳鑰匙！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 9 章跨域企劃精髓"}, {"num": 3, "type": "2card", "tag": "案例一深度剖析", "title": "案例一經典借鏡：【愛心同行 Pass APP 企劃案】的六大亮點剖析", "subtitle": "將身心障礙友善理念轉化為雙邊商業網絡平台模式", "cards": [{"title": "跳脫悲情，定位為『共融生活平台』", "desc": "策略定位上的重大突破", "points": ["問題真因界定：指出社會大眾不是沒有友善意識，而是缺乏『整合資訊』與『日常實踐路徑』", "擺脫悲情訴求：不靠博取同情，而是提供好玩、便利的無障礙生活動線與日常消費集點機制", "精準抓住 ESG 浪潮：將企業社會責任預算轉化為平台的贊助與合作動力"]}, {"title": "三大模組與短中長期發展階梯", "desc": "縝密的產品架構與落地規劃", "points": ["三大核心模組：主軸（友善路線規劃）、內容（社群心得回饋）、生態（企業特約店家與 ESG 合作）", "雙邊網絡效應：使用者越多 ➜ 吸引越多元友善店家加入 ➜ 平台價值幾何級成長", "推廣策略接地氣：運用校園短影音挑戰賽與圖文散播，引發年輕人自豪轉發"]}]}, {"num": 4, "type": "2card", "tag": "案例二深度剖析", "title": "案例二實戰借鏡：【LINE 在南故宮企劃案】的數位實體串聯亮點", "subtitle": "運用大眾高頻日常工具，解決外在環境導致的實體客流萎縮", "cards": [{"title": "以零門檻數位工具打破參觀障礙", "desc": "拒絕開發無人下載的笨重專用 APP", "points": ["客觀市場調查支撐：透過大量問卷佐證，目標受眾強烈排斥額外下載 APP，但高達 95% 天天使用 LINE", "輕量化互動體驗：運用 LINE 官方帳號結合定位與聊天機器人，打造隨身虛擬導覽員", "降低心理門檻：用親切的對話式問答，將深奧的文物歷史轉譯為趣味解謎遊戲"]}, {"title": "展前、展中、展後的完整溝通時間軸", "desc": "架構井然有序的顧客傳播旅程", "points": ["展前預熱：LINE 心理測驗推播，找出你前世是哪一件國寶，激發造訪衝動", "展中互動：實地尋寶解謎集章，即時兌換文創小禮，大幅拉長館內停留時間", "展後回訪：推播特展延伸故事與線上商城優惠，維持長期情感連結"]}]}, {"num": 5, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 建構微型創業的跨域生態：輕量數位管道佈局", "subtitle": "大學生創業無需百萬預算，利用免費工具組裝強大數位網絡", "cards": [{"title": "1. 規劃雙邊價值交換機制", "desc": "打造能自我生長的良性互動循環", "points": ["思考：除了買賣雙方，還有哪些校園周邊商家或學生社團能成為互利夥伴？", "透過 AI 快速模擬各方利益訴求，設計零摩擦的合作方案"]}, {"title": "2. 單頁 HTML 網頁無縫串接 LINE 與社群", "desc": "打造最順暢的預約與諮詢體驗動線", "points": ["網頁按鈕一鍵跳轉官方 LINE 或 IG 私訊", "消除表單填寫的冰冷感，即時提供溫暖的真人式互動反饋"]}, {"title": "3. 跨界公共價值故事提煉", "desc": "為專案注入動人的社會情懷", "points": ["讓小組專案不僅是賺錢的生意，更成為改善校園生活或支持地方創生的溫暖行動", "在期末發表中展現令人肅然起敬的格局與格局高度"]}]}, {"num": 6, "type": "content", "tag": "課堂跨域整合設計實作", "title": "課堂實作工作坊：為小組微型創業專案繪製《跨域合作與數位接觸網絡圖》", "content": "【各組 15 分鐘跨域串聯規劃】：\n1. 【跨界夥伴鎖定】：找出 1 個校內或校外的潛在合作夥伴（如校園社團、在地店家、系學會）。\n2. 【雙贏機制設計】：他們能獲得什麼好處？（如免費宣傳、增加人流）；我們能獲得什麼？（如曝光通路、實體寄賣）。\n3. 【數位接觸點整合】：確認微型商業網頁如何串接社群或通訊軟體，形成零門檻的互動體驗！"}]}, {"week_num": 14, "module": "模組四：網路服務實踐與成果發表", "title": "行銷企劃書撰寫與文字排版美學：掌握合理架構，徹底掃除八大文字毛病", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 企劃書撰寫", "title": "行銷企劃書撰寫與文字排版美學：掌握合理架構，徹底掃除八大文字毛病", "subtitle": "企劃品質檢核表 ｜ 掃除打轉與贅字等八大毛病 ｜ 圖表勝文字原則 ｜ 平實易讀的排版美學", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "企劃閱讀痛點破題", "title": "職場閱讀痛點：主管每天看十幾份企劃案，最痛恨的是什麼？", "quote": "「企劃書的讀者與審查主管往往極度忙碌。當他們打開一份企劃書，映入眼簾的是密密麻麻毫無斷句的長篇大論、充滿打轉繞圈的贅字、滿嘴不知所云的形容詞，主管只會感到無比煩躁並迅速合上企劃書。在顧及企劃品質的前提下，優秀企劃師的首要責任，是提升讀者的閱讀與理解效率！文字明確俐落，方案才具備強大說服力！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 10 章文字心法"}, {"num": 3, "type": "3card", "tag": "企劃合理架構檢核表", "title": "行銷企劃合理架構與重點檢核表（曾光華三大支柱檢核系統）", "subtitle": "確保企劃案具備嚴密骨架，杜絕結構鬆散漏洞", "cards": [{"title": "企劃背景與目標檢核（邏輯）", "desc": "檢驗企劃論證的必要性與起點", "points": ["□ 是否精準點出本次企劃面對的核心行銷問題或機會真因？", "□ 是否呈現出本企劃的必要性、迫切性與商業價值？", "□ 企劃目標是否清楚具體？是否帶入圖像與感覺激勵人心？"]}, {"title": "企劃方案與策略檢核（創意）", "desc": "檢驗解決方案的契合度與特色", "points": ["□ 企劃方案是否完全緊扣企劃目標？是否有助於達成預期效益？", "□ 是否充分發揮自身優勢，迴避外在威脅，掌握市場機會？", "□ 是否具備獨特差異化，讓目標消費者感受到新穎與吸引力？"]}, {"title": "預估效益與執行檢核（執行力）", "desc": "檢驗落地推進的細節與可行性", "points": ["□ 是否根據方案提出可信、具推導根據的量化與質性效益？", "□ 工作進度、查核點里程碑與責任分工是否清楚明確？", "□ 預算編列是否細緻合理？是否設有風險停損底線？"]}]}, {"num": 4, "type": "4card", "tag": "掃除八大文字毛病（一）", "title": "文字表達明確俐落：曾光華教授警示的【前四大文字毛病】", "subtitle": "字字珠璣，每一句話都要為讀者節省腦力", "cards": [{"title": "毛病 1：打轉繞圈", "desc": "反覆兜圈子，講了半天還沒切入核心", "points": ["不良案例：『關於本產品的特色，我們經過了深入探討，大家都覺得這是一個很棒的想法，具體來說就是……』", "改善之道：開門見山，直接說結論與關鍵數據！"]}, {"title": "毛病 2：畫蛇添足", "desc": "交代過多與核心論點無關的瑣碎資訊", "points": ["不良案例：『因為昨天剛好下雨，我們在便利商店門口避雨時突然想到這個點子……』", "改善之道：刪除個人日記式流水帳，聚焦於商業事實與市場痛點"]}, {"title": "毛病 3：濫用名詞", "desc": "堆砌生硬拗口的專有名詞，故弄玄虛", "points": ["不良案例：『本專案將打造全維度矩陣化心智生態系之沉浸式多觸點互動空間……』", "改善之道：說人話！用大白話清楚說明『這到底是什麼服務』"]}, {"title": "毛病 4：濫用動詞", "desc": "一個句子塞入四五個動詞，動線混亂", "points": ["不良案例：『我們進行展開推動實施落實這項促銷方案……』", "改善之道：每句話只保留一個最強而有力的核心動作"]}]}, {"num": 5, "type": "4card", "tag": "掃除八大文字毛病（二）", "title": "文字表達明確俐落：曾光華教授警示的【後四大文字毛病】", "subtitle": "修煉文筆節奏感，讓企劃書如行雲流水般暢快易讀", "cards": [{"title": "毛病 5：濫用形容詞", "desc": "充斥『非常、極度、超級、無敵』等主觀評價", "points": ["不良案例：『我們提供超級無敵完美、極度受歡迎、非常棒的服務……』", "改善之道：用具體客觀的事實與數據說話，讓讀者自己得出『很棒』的結論"]}, {"title": "毛病 6：贅字冗詞", "desc": "『進行一個確認的動作』之類的冗詞贅句", "points": ["不良案例：『我們將會針對該問題進行一個深入研究的動作……』", "改善之道：直接寫『我們深入研究該問題』，俐落有力！"]}, {"title": "毛病 7：不當斷句", "desc": "在不該分段的地方硬斷，打碎語意連貫", "points": ["不良案例：把一個完整主語和賓語拆成兩行，造成閱讀停頓困惑", "改善之道：按照完整意義單元斷行，保持視覺流暢"]}, {"title": "毛病 8：逗點到底", "desc": "整整 200 字只有逗號沒有句號，讀者喘不過氣", "points": ["不良案例：一口氣十幾個子句全用逗號連在一起，找不到主從焦點", "改善之道：【一意一句】！每個句子只講一個焦點，果斷用句號收尾！"]}]}, {"num": 6, "type": "2card", "tag": "圖表與美工排版", "title": "【圖表勝文字】原則與平實易讀的排版美學（曾光華排版規範）", "subtitle": "美工排版不是為了花俏炫技，而是為了促進理解與閱讀效率", "cards": [{"title": "圖表呈現的三大黃金守則", "desc": "讓數據瞬間說話，一目了然", "points": ["1.【清楚標示】：座標軸縱軸、橫軸、單位、圖例必須標註清晰完整，杜絕猜謎", "2.【產生深入意義】：圖表不能只放數字，必須在標題或圖旁直接標出『關鍵結論或洞見』", "3.【寧缺毋濫】：不為了放圖而放圖，每張圖表都必須為論點提供強大支撐"]}, {"title": "貫穿全文的規格化排版原則", "desc": "展現企管人的專業嚴謹與美學素養", "points": ["一致的字型層次：主標題、副標題、內文與註釋維持嚴格字級與行距規格", "留白帶來尊榮感：適度留白讓眼睛休息，版面緊湊而不擁擠", "色彩節制原則：全篇採用統一主色調（如萬能藍/海軍藍），點綴警示色，嚴禁五彩斑斕"]}]}, {"num": 7, "type": "3card", "tag": "AI 協同實踐橋樑", "title": "以 AI Agent 充當專業文字編輯：自動抓出贅字、拆解長句與圖表化建議", "subtitle": "你的私人文字教練，在企劃完稿前進行嚴苛的字句拋光", "cards": [{"title": "1. 啟動『贅字狙擊手 Agent』", "desc": "自動排查八大文字毛病", "points": ["提示詞：『請依據曾光華教授八大文字毛病守則，檢查以下企劃草案：找出所有打轉繞圈、贅字冗詞與逗點到底的句子，並改寫為明確俐落的版本！』", "瞬間讓企劃書文字精煉度提升 50%"]}, {"title": "2. 文字轉表格與結構化提煉", "desc": "將冗長段落一鍵轉為高對比度表格", "points": ["提示詞：『請將這段長篇文字描述，轉化為具備標題、重點說明與對比維度的清晰 Markdown 表格……』", "實現『圖表勝文字』的視覺化奇效"]}, {"title": "3. 企劃人的審美定稿把關", "desc": "保留文字的溫度與生活感", "points": ["確認精簡後的文字依然保留小組專案的獨特熱忱與生活五感", "完成微型創業企劃書的最終完美定稿！"]}]}, {"num": 8, "type": "content", "tag": "課堂文字修煉實作", "title": "課堂實作工作坊：為小組企劃書進行【八大文字毛病無情大掃除】", "content": "【各組 15 分鐘文筆拋光實戰】：\n1. 【互挑毛病】：交換閱讀組員撰寫的企劃段落，用紅筆或線上標註圈出所有的贅字、濫用形容詞或長句逗點到底。\n2. 【俐落重構】：落實『一意一句』原則，將一段 100 字的冗長論述精簡為 50 字的俐落金句。\n3. 【圖表化】：將至少一處純文字列述改繪為表格或流程圖。\n4. 各組備妥文字拋光後的企劃精華，準備投入下週說服型簡報設計！"}]}, {"week_num": 15, "module": "模組四：網路服務實踐與成果發表", "title": "說服型簡報設計與台前演出技巧：建立說服心態，精心設計內容與台風", "slides": [{"num": 1, "type": "title", "tag": "曾光華企劃經典 ✕ 簡報演說", "title": "說服型簡報設計與台前演出技巧：建立說服心態，精心設計內容與台風", "subtitle": "任務是說服而非報告 ｜ 聽眾與情境分析 ｜ 精心設計簡報內容 ｜ 台上精彩演出與控場技巧", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "簡報本質破題", "title": "簡報大師心法：簡報不是在『朗讀投影片』，而是一場『引導靈魂共鳴的對話』！", "quote": "「許多同學一上台就盯著大螢幕念投影片，背對觀眾、聲音顫抖、眼神游移。曾光華教授鄭重提醒：簡報的任務從來不是『報告（Reporting）』，而是『說服（Persuading）』！聽眾坐在台下，是把寶貴的時間借給了你；你要用清晰的邏輯拆解疑慮，用動人的創意喚起共鳴，用自信的台風證明你們能把企劃實現！精心設計的簡報，是優秀企劃師最有力的戰鬥武器！」", "author": "—— 曾光華《行銷企劃：邏輯、創意、執行力》第 10 章簡報心法"}, {"num": 3, "type": "2card", "tag": "建立正確心態", "title": "說服型簡報的兩大核心基石：【建立說服心態】與【掌握現場情境】", "subtitle": "未曾分析聽眾與現場設施的簡報，就像蒙著眼睛射箭", "cards": [{"title": "心態確立：從『我要報告』轉向『我要說服』", "desc": "站在聽眾的角度思考利益與關切點", "points": ["報告心態：只想把自己做的事情從頭到尾念完，不管台下有沒有聽懂", "說服心態：時時刻刻關注『這段話是否解答了聽眾心中的疑問？能否激發其投資或支持的意願？』", "焦點轉移：把鎂光燈打在聽眾的利益上，而非炫耀自己的辛勞"]}, {"title": "掌握情境：深刻瞭解聽眾與現場設施", "d d Archetypes）定義主色系（科技藍/溫暖橘/活力綠）", "杜絕廉價感，樹立專業值得信賴的品牌形象"]}, {"title": "FontAwesome ✕ 本地原生互動", "desc": "零外部依賴的順暢操作體驗", "points": ["引用開源圖標庫，豐富視覺層次", "純原生 JavaScript 控制表單驗證與彈窗跳轉，無相容性隱患", "確保下週部署至 GitHub Pages 時 100% 穩定呈現"]}]}, {"num": 5, "type": "2card", "tag": "提示詞驅動實踐", "title": "運用 CLEAR 框架引導 Antigravity 生成完整單頁網頁程式碼", "subtitle": "以產品經理（PM）的高度指揮 AI Agent 產出世界級網頁原型", "cards": [{"title": "專案提示詞的核心輸入要素", "desc": "清楚交代企劃精華，杜絕 AI 自由胡說", "points": ["【身分】：你是頂級的前端產品經理兼 UI 設計師", "【任務】：請為我們的小組微型創業專案生成一個單一 index.html 網頁程式碼", "【品牌資訊】：輸入小組專案名稱、標語、3 大特色與定價內容", "【技術規範】：必須使用 Tailwind CSS CDN、必須自適應手機、必須包含可點擊的預約互動彈窗"]}, {"title": "產品經理驗收三步驟（人機治理）", "desc": "落實最終品質檢驗責任", "points": ["1.【雙擊開啟】：將 AI 生成的程式碼存為 index.html，雙擊直接在瀏覽器運行", "2.【按鈕點擊測試】：親自點擊導航連結、預約按鈕，確認彈窗正常跳出", "3.【文字微調修訂】：檢查所有文字是否符合台灣用語規範，杜絕任何生硬字詞"]}]}, {"num": 6, "type": "content", "tag": "課堂原型打造實戰", "title": "課堂實作工作坊：各組以自然語言生成專案《單一 index.html 微型商業網頁》", "content": "【各組 25 分鐘實作產出】：\n1. 【輸入企劃資訊】：將小組前幾週淬煉的痛點、定位、三大賣點輸入教學平台【Antigravity 原型生成器】。\n2. 【生成與微調】：檢視產出的網頁程式碼，微調品牌配色與標語文字。\n3. 【本地雙擊驗收】：在電腦瀏覽器中開啟 index.html，確認 5 大區塊完整、點擊按鈕彈窗互動順暢。\n4. 備妥 index.html 檔案，下週課堂將正式登上 GitHub Pages 向全世界公開發布！"}]}, {"week_num": 17, "module": "模組四：網路服務實踐與成果發表", "title": "【期末實戰二】GitHub Pages 全球公開發布部署與說服型 Demo 全流程彩排", "slides": [{"num": 1, "type": "title", "tag": "期末實踐 ✕ 雲端部署", "title": "【期末實戰二】GitHub Pages 全球公開發布部署與說服型 Demo 全流程彩排", "subtitle": "免指令免安裝 ｜ 取得全球獨立 HTTPS 網址 ｜ 3+1 簡報與網頁串聯彩排 ｜ 手機端體驗調優", "author": "授課教師：邱俊維 博士 ｜ 萬能科技大學 企業管理系"}, {"num": 2, "type": "quote", "tag": "全球發布自豪感破題", "title": "公開發布的里程碑自豪感：從在地教室出發，讓全世界都能在手機上看見你的創業實踐！", "quote": "「今天，每一組的大一同學都將完成一項了不起的成就：將上週打造的商務網頁，透過 GitHub Pages 免費雲端託管服務，發布為真正擁有獨立 HTTPS 網址的全球公開網站！當你把網址傳給父母、朋友，當他們拿起手機點開網頁、親眼看到你們親手打造的品牌時，那份實踐的自豪感將深深烙印在你的大學青春裡！」", "author": "—— 邱俊維 博士 雲端部署動員致詞"}, {"num": 3, "type": "3card", "tag": "GitHub Pages 三步驟", "title": "【免指令、免安裝】GitHub Pages 雲端部署 3 步驟實務指引", "subtitle": "純網頁版介面操作，3 分鐘輕鬆上線", "cards": [{"title": "步驟一：建立專屬公開倉庫（Repository）", "desc": "在 GitHub 建立專案雲端空間", "points": ["登入 GitHub 帳     let currentWeekIdx = 0;
    let currentSlideIdx = 0;

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function initUI() {
        // Mobile bottom navigation bindings
        const mobPrev = document.getElementById('mobileBtnPrev');
        const mobNext = document.getElementById('mobileBtnNext');
        if (mobPrev) mobPrev.addEventListener('click', prevSlide);
        if (mobNext) mobNext.addEventListener('click', nextSlide);

        // Touch swipe gesture support for mobile phones (左右滑動翻頁)
        const stageEl = document.getElementById('slideStage');
        if (stageEl) {
            let touchStartX = 0;
            let touchStartY = 0;
            stageEl.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });

            stageEl.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
                    if (deltaX < 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            }, { passive: true });
        }

        const weekSelect = document.getElementById('weekSelect');
        weekSelect.innerHTML = '';
        CURRICULUM.forEach((w, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `第 ${String(w.week_num).padStart(2, '0')} 週：${w.title.substring(0, 18)} (${w.slides.length}頁)`;
            weekSelect.appendChild(opt);
        });

        weekSelect.addEventListener('change', (e) => {
            currentWeekIdx = parseInt(e.target.value, 10);
            currentSlideIdx = 0;
            loadWeek();
        });

        document.getElementById('slideSelect').addEventListener('change', (e) => {
            currentSlideIdx = parseInt(e.target.value, 10);
            renderCurrentSlide();
        });

        document.getElementById('btnPrev').addEventListener('click', prevSlide);
        document.getElementById('btnNext').addEventListener('click', nextSlide);
        document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

        // Floating fullscreen controls listeners
        const fsBtnPrev = document.getElementById('fsBtnPrev');
        const fsBtnNext = document.getElementById('fsBtnNext');
        const fsBtnExit = document.getElementById('fsBtnExit');
        if (fsBtnPrev) fsBtnPrev.addEventListener('click', prevSlide);
        if (fsBtnNext) fsBtnNext.addEventListener('click', nextSlide);
        if (fsBtnExit) fsBtnExit.addEventListener('click', () => {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        // Fullscreen state listener for robust styling
        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            document.body.classList.toggle('is-fullscreen-active', isFs);
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === 'Home') {
                e.preventDefault();
                currentSlideIdx = 0;
                renderCurrentSlide();
            } else if (e.key === 'End') {
                e.preventDefault();
                const slides = CURRICULUM[currentWeekIdx].slides;
                currentSlideIdx = slides.length - 1;
                renderCurrentSlide();
            }
        });

        loadWeek();
    }

    function loadWeek() {
        const weekData = CURRICULUM[currentWeekIdx];
        const slides = weekData.slides;

        // Populate slide select
        const slideSelect = document.getElementById('slideSelect');
        slideSelect.innerHTML = '';
        slides.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            let label = s.title || (s.layout === 'cover' ? '封面' : (s.layout === 'section' ? `${s.num}：${s.title}` : '總結'));
            opt.textContent = `${idx + 1}/${slides.length}: ${label.substring(0, 24)}`;
            slideSelect.appendChild(opt);
        });

        document.getElementById('weekSelect').value = currentWeekIdx;
        document.getElementById('curriculumModuleTag').textContent = `【${weekData.module}】`;

        renderCurrentSlide();
    }

    function getThemeStyles(theme) {
        switch (theme) {
            case 'teal':
                return { border: 'border-teal-500/60', text: 'text-teal-400', bar: 'from-teal-500 to-emerald-400', badge: 'bg-teal-500/20 text-teal-300' };
            case 'emerald':
                return { border: 'border-emerald-500/60', text: 'text-emerald-400', bar: 'from-emerald-500 to-teal-400', badge: 'bg-emerald-500/20 text-emerald-300' };
            case 'amber':
                return { border: 'border-amber-500/60', text: 'text-amber-400', bar: 'from-amber-500 to-orange-400', badge: 'bg-amber-500/20 text-amber-300' };
            case 'gold':
                return { border: 'border-yellow-500/60', text: 'text-yellow-400', bar: 'from-yellow-500 to-amber-400', badge: 'bg-yellow-500/20 text-yellow-300' };
            case 'indigo':
                return { border: 'border-indigo-500/60', text: 'text-indigo-400', bar: 'from-indigo-500 to-purple-400', badge: 'bg-indigo-500/20 text-indigo-300' };
            case 'purple':

            default: // blue/navy
                return { border: 'border-blue-500/60', text: 'text-blue-400', bar: 'from-blue-600 to-indigo-500', badge: 'bg-blue-500/20 text-blue-300' };
        }
    }

                        ${escapeHtml(badge || 'UNIT STUDY')}

                    <span class="text-xs sm:text-sm font-extrabold text-teal-400 tracking-wider">

                            ${(card.points || []).map(p => `
                            <li class="flex items-start gap-4 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${p.includes('★') ? 'text-amber-400' : (p.includes('✔') ? 'text-emerald-400' : theme.text)} font-black text-3xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            </div>
            `;
        } else if (layout === '2card') {
            const left = slide.left || {};
            const right = slide.right || {};
            const tLeft = getThemeStyles(left.theme || 'blue');
            const tRight = getThemeStyles(right.theme || 'teal');
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    <div class="bg-slate-800/90 rounded-2xl border-2 ${tLeft.border} p-6 lg:p-7 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tLeft.bar}"></div>
                        <h3 class="text-2xl md:text-3xl font-black ${tLeft.text} mb-4 lg:mb-5">
                            ${escapeHtml(left.title)}
                        </h3>
                        <ul class="space-y-3.5 lg:space-y-4">
                            ${(left.points || []).map(p => `
                            <li class="flex items-start gap-3 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${tLeft.text} font-black text-2xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                    <div class="bg-slate-800/90 rounded-2xl border-2 ${tRight.border} p-6 lg:p-7 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tRight.bar}"></div>
                        <h3 class="text-2xl md:text-3xl font-black ${tRight.text} mb-4 lg:mb-5">
                            ${escapeHtml(right.title)}
                        </h3>
                        <ul class="space-y-3.5 lg:space-y-4">
                            ${(right.points || []).map(p => `
                            <li class="flex items-start gap-3 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${tRight.text} font-black text-2xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            </div>
            `;
        } else if (layout === '3card') {
            const cards = slide.cards || (slide.col1 ? [slide.col1, slide.col2, slide.col3] : (slide.c1 ? [slide.c1, slide.c2, slide.c3, slide.c4] : []));
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    ${cards.map((c, idx) => {
                        const tCard = getThemeStyles(c.theme || (idx === 0 ? 'blue' : (idx === 1 ? 'teal' : 'amber')));
                        return `
                        <div class="bg-slate-800/90 rounded-2xl border-2 ${tCard.border} p-5 lg:p-6 flex flex-col shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tCard.bar}"></div>
                            <h3 class="text-xl md:text-2xl font-black ${tCard.text} mb-3.5">
                                ${escapeHtml(c.title)}
                            </h3>
                            <ul class="space-y-3">
                                ${(c.points || []).map(p => `
                                <li class="flex items-start gap-2.5 text-slate-100 point-multi-card font-medium leading-relaxed">
                                    <span class="${tCard.text} font-black text-2xl shrink-0 mt-1">•</span>
                                    <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                                </li>
                                `).join('')}
                            </ul>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        } else if (layout === '4card') {
            const cards = slide.cards || (slide.col1 ? [slide.col1, slide.col2, slide.col3] : (slide.c1 ? [slide.c1, slide.c2, slide.c3, slide.c4] : []));
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-5 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    ${cards.map((c, idx) => {
                        const tCard = getThemeStyles(c.theme || (idx === 0 ? 'blue' : (idx === 1 ? 'teal' : (idx === 2 ? 'indigo' : 'amber'))));
                        return `
                        <div class="bg-slate-800/90 rounded-2xl border-2 ${tCard.border} p-4 lg:p-5 flex flex-col shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tCard.bar}"></div>
                            ${c.num ? `
                            <span class="text-xs font-black tracking-wider px-2 py-0.5 rounded ${tCard.badge} w-fit mb-2">
                                ${escapeHtml(c.num)}
                            </span>
                            ` : ''}
                            <h3 class="text-lg md:text-xl font-black text-white mb-2.5">
                                ${escapeHtml(c.title)}
                            </h3>
                            <ul class="space-y-2 lg:space-y-2.5">
                                ${(c.points || []).map(p => `
                                <li class="flex items-start gap-2 text-slate-100 point-multi-card font-medium leading-relaxed">
                                    <span class="${tCard.text} font-bold text-xl shrink-0 mt-1">•</span>
                                    <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                                </li>
                                `).join('')}
                            </ul>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        } else if (layout === 'closing') {
            html = `
            <div class="h-full flex flex-col justify-center px-4 py-4 sm:px-8 md:px-20 animate-fadeIn">
                <div class="inline-block px-5 py-2 rounded-xl bg-amber-600 text-white font-black text-base md:text-lg tracking-widest mb-6 w-fit shadow-xl shadow-amber-500/30">
                    UNIT COMPLETED
                </div>
                <h2 class="text-2xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-white mb-4 sm:mb-6 leading-tight max-w-5xl drop-shadow-md">
                    ${escapeHtml(slide.title || '單元授課完畢')}
                </h2>
                <p class="text-2xl md:text-3xl text-slate-200 font-bold max-w-4xl leading-relaxed mb-8">
                    ${escapeHtml(slide.subtitle || '感謝各位的專注投入與深度研討！請個人組長妥善保存工作表。')}
                </p>
                <div class="pt-6 border-t-2 border-slate-800 text-lg md:text-xl font-bold text-teal-400">
                    ${escapeHtml(slide.final_message || '期末成果閉環：Antigravity 生成單頁網站 ➔ GitHub Pages 全球發布 ➔ Demo Day 競演')}
                </div>
            </div>
            `;
        }

        // CRITICAL: Put HTML into stage!
        stage.innerHTML = html;
    }

    function prevSlide() {
        if (currentSlideIdx > 0) {
            currentSlideIdx--;
            renderCurrentSlide();
        } else if (currentWeekIdx > 0) {
            currentWeekIdx--;
            const prevWeekSlides = CURRICULUM[currentWeekIdx].slides;
            currentSlideIdx = prevWeekSlides.length - 1;
            loadWeek();
        }
    }

    function nextSlide() {
        const currentWeekSlides = CURRICULUM[currentWeekIdx].slides;
        if (currentSlideIdx < currentWeekSlides.length - 1) {
            currentSlideIdx++;
            renderCurrentSlide();
        } else if (currentWeekIdx < CURRICULUM.length - 1) {
            currentWeekIdx++;
            currentSlideIdx = 0;
            loadWeek();
        }
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => {
                    document.body.classList.add('is-fullscreen-active');
                }).catch(err => {
                    console.log("Fullscreen request failed, applying fallback", err);
                    document.body.classList.toggle('is-fullscreen-active');
                });
            } else {
                document.body.classList.toggle('is-fullscreen-active');
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen().then(() => {
                    document.body.classList.remove('is-fullscreen-active');
                }).catch(() => {
                    document.body.classList.remove('is-fullscreen-active');
                });
            } else {
                document.body.classList.remove('is-fullscreen-active');
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUI);
    } else {
        initUI();
    }
    </script>
</body>
</html>
