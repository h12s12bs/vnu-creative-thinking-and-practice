    let currentWeekIdx = 0;
    let currentSlideIdx = 0;

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function initUI() {
        const weekSelect = document.getElementById('weekSelect');
        weekSelect.innerHTML = '';
        CURRICULUM.forEach((w, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `第 ${String(w.week_num).padStart(2, '0')} 週：${w.title.substring(0, 18)} (${w.slides.length}頁)`;
            weekSelect.appendChild(opt);
        });

        weekSelect.addEventListener('change', (e) => {
            currentWeekIdx = parseInt(e.target.value, 10);
            currentSlideIdx = 0;
            loadWeek();
        });

        document.getElementById('slideSelect').addEventListener('change', (e) => {
            currentSlideIdx = parseInt(e.target.value, 10);
            renderCurrentSlide();
        });

        document.getElementById('btnPrev').addEventListener('click', prevSlide);
        document.getElementById('btnNext').addEventListener('click', nextSlide);
        document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

        // Floating fullscreen controls listeners
        const fsBtnPrev = document.getElementById('fsBtnPrev');
        const fsBtnNext = document.getElementById('fsBtnNext');
        const fsBtnExit = document.getElementById('fsBtnExit');
        if (fsBtnPrev) fsBtnPrev.addEventListener('click', prevSlide);
        if (fsBtnNext) fsBtnNext.addEventListener('click', nextSlide);
        if (fsBtnExit) fsBtnExit.addEventListener('click', () => {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            }
        });

        // Fullscreen state listener for robust styling
        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            document.body.classList.toggle('is-fullscreen-active', isFs);
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === 'Home') {
                e.preventDefault();
                currentSlideIdx = 0;
                renderCurrentSlide();
            } else if (e.key === 'End') {
                e.preventDefault();
                const slides = CURRICULUM[currentWeekIdx].slides;
                currentSlideIdx = slides.length - 1;
                renderCurrentSlide();
            }
        });

        loadWeek();
    }

    function loadWeek() {
        const weekData = CURRICULUM[currentWeekIdx];
        const slides = weekData.slides;

        // Populate slide select
        const slideSelect = document.getElementById('slideSelect');
        slideSelect.innerHTML = '';
        slides.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            let label = s.title || (s.layout === 'cover' ? '封面' : (s.layout === 'section' ? `${s.num}：${s.title}` : '總結'));
            opt.textContent = `${idx + 1}/${slides.length}: ${label.substring(0, 24)}`;
            slideSelect.appendChild(opt);
        });

        document.getElementById('weekSelect').value = currentWeekIdx;
        document.getElementById('curriculumModuleTag').textContent = `【${weekData.module}】`;

        renderCurrentSlide();
    }

    function getThemeStyles(theme) {
        switch (theme) {
            case 'teal':
                return { border: 'border-teal-500/60', text: 'text-teal-400', bar: 'from-teal-500 to-emerald-400', badge: 'bg-teal-500/20 text-teal-300' };
            case 'emerald':
                return { border: 'border-emerald-500/60', text: 'text-emerald-400', bar: 'from-emerald-500 to-teal-400', badge: 'bg-emerald-500/20 text-emerald-300' };
            case 'amber':
                return { border: 'border-amber-500/60', text: 'text-amber-400', bar: 'from-amber-500 to-orange-400', badge: 'bg-amber-500/20 text-amber-300' };
            case 'gold':
                return { border: 'border-yellow-500/60', text: 'text-yellow-400', bar: 'from-yellow-500 to-amber-400', badge: 'bg-yellow-500/20 text-yellow-300' };
            case 'indigo':
                return { border: 'border-indigo-500/60', text: 'text-indigo-400', bar: 'from-indigo-500 to-purple-400', badge: 'bg-indigo-500/20 text-indigo-300' };
            case 'purple':
                return { border: 'border-purple-500/60', text: 'text-purple-400', bar: 'from-purple-500 to-pink-400', badge: 'bg-purple-500/20 text-purple-300' };
            default: // blue/navy
                return { border: 'border-blue-500/60', text: 'text-blue-400', bar: 'from-blue-600 to-indigo-500', badge: 'bg-blue-500/20 text-blue-300' };
        }
    }

    function renderHeader(badge, sec, title, subtitle, curNum, total) {
        return `
        <div class="border-b-2 border-slate-800 pb-3.5 mb-4 flex items-center justify-between shrink-0">
            <div>
                <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full bg-blue-900/60 border border-blue-500/40 text-blue-300 font-bold text-xs tracking-wider uppercase">
                        ${escapeHtml(badge || 'UNIT STUDY')}
                    </span>
                    <span class="text-sm font-extrabold text-teal-400 tracking-wider">
                        ${escapeHtml(sec || '專業核心單元')}
                    </span>
                </div>
                <h2 class="text-2xl md:text-3xl lg:text-4xl font-black text-white tracking-tight mt-1.5 leading-tight">
                    ${escapeHtml(title)}
                </h2>
                ${subtitle ? `<p class="text-sm md:text-base text-slate-400 font-medium mt-0.5">${escapeHtml(subtitle)}</p>` : ''}
            </div>
            <div class="text-right shrink-0">
                <span class="text-sm md:text-base font-mono font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                    ${curNum} / ${total}
                </span>
            </div>
        </div>
        `;
    }

    function renderCurrentSlide() {
        const weekData = CURRICULUM[currentWeekIdx];
        const slides = weekData.slides;
        const slide = slides[currentSlideIdx];
        const stage = document.getElementById('slideStage');
        const total = slides.length;
        const curNum = currentSlideIdx + 1;

        document.getElementById('slideSelect').value = currentSlideIdx;
        document.getElementById('pageIndicator').textContent = `${curNum} / ${total}`;
        const fsIndicator = document.getElementById('fsPageIndicator');
        if (fsIndicator) fsIndicator.textContent = `${curNum} / ${total}`;

        let html = '';
        const layout = slide.layout || '1card';

        if (layout === 'cover') {
            html = `
            <div class="h-full flex flex-col justify-center px-8 md:px-16 animate-fadeIn">
                <div class="flex items-center gap-4 mb-4">
                    <span class="w-3 h-14 bg-gradient-to-b from-blue-500 to-amber-400 rounded-full"></span>
                    <span class="text-amber-400 text-lg md:text-2xl font-black tracking-wider uppercase">
                        【${escapeHtml(slide.badge || weekData.module)}】
                    </span>
                </div>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-tight mb-6 max-w-6xl tracking-tight drop-shadow-xl">
                    ${escapeHtml(slide.title)}
                </h1>
                <p class="text-xl md:text-2xl lg:text-3xl text-slate-200 font-bold max-w-5xl leading-relaxed mb-8">
                    ${escapeHtml(slide.subtitle)}
                </p>
                <div class="pt-6 border-t-2 border-slate-800/90 flex flex-wrap items-center gap-6 text-base md:text-lg font-bold text-slate-300">
                    ${(slide.meta || ['萬能科技大學 企業管理系', '授課教師：邱俊維 博士 / 助理教授']).map(m => `
                        <span class="flex items-center gap-2 text-teal-300 bg-teal-950/40 px-3 py-1.5 rounded-lg border border-teal-600/40">
                            ✔ ${escapeHtml(m)}
                        </span>
                    `).join('')}
                </div>
            </div>
            `;
        } else if (layout === 'section') {
            html = `
            <div class="h-full flex flex-col justify-center px-8 md:px-20 animate-fadeIn">
                <div class="inline-block px-5 py-2.5 rounded-xl bg-blue-600 text-white font-black text-base md:text-lg tracking-widest mb-6 w-fit shadow-xl shadow-blue-500/30">
                    ${escapeHtml(slide.num || 'CHAPTER')}
                </div>
                <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-6 leading-tight max-w-5xl drop-shadow-md">
                    ${escapeHtml(slide.title)}
                </h2>
                <p class="text-2xl md:text-3xl text-slate-300 font-semibold max-w-4xl leading-relaxed">
                    ${escapeHtml(slide.desc)}
                </p>
            </div>
            `;
        } else if (layout === '1card') {
            const card = slide.card || {};
            const theme = getThemeStyles(card.theme || 'blue');
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 flex flex-col py-2 overflow-y-auto custom-scrollbar">
                    <div class="bg-slate-800/90 rounded-2xl border-2 ${theme.border} p-8 flex-1 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2.5 bg-gradient-to-r ${theme.bar}"></div>
                        <h3 class="text-2xl md:text-3xl lg:text-4xl font-black ${theme.text} mb-6 flex items-center gap-3">
                            ${escapeHtml(card.title)}
                        </h3>
                        <ul class="space-y-4">
                            ${(card.points || []).map(p => `
                            <li class="flex items-start gap-4 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${p.includes('★') ? 'text-amber-400' : (p.includes('✔') ? 'text-emerald-400' : theme.text)} font-black text-3xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            </div>
            `;
        } else if (layout === '2card') {
            const left = slide.left || {};
            const right = slide.right || {};
            const tLeft = getThemeStyles(left.theme || 'blue');
            const tRight = getThemeStyles(right.theme || 'teal');
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    <div class="bg-slate-800/90 rounded-2xl border-2 ${tLeft.border} p-6 lg:p-7 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tLeft.bar}"></div>
                        <h3 class="text-2xl md:text-3xl font-black ${tLeft.text} mb-4 lg:mb-5">
                            ${escapeHtml(left.title)}
                        </h3>
                        <ul class="space-y-3.5 lg:space-y-4">
                            ${(left.points || []).map(p => `
                            <li class="flex items-start gap-3 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${tLeft.text} font-black text-2xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                    <div class="bg-slate-800/90 rounded-2xl border-2 ${tRight.border} p-6 lg:p-7 flex flex-col shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tRight.bar}"></div>
                        <h3 class="text-2xl md:text-3xl font-black ${tRight.text} mb-4 lg:mb-5">
                            ${escapeHtml(right.title)}
                        </h3>
                        <ul class="space-y-3.5 lg:space-y-4">
                            ${(right.points || []).map(p => `
                            <li class="flex items-start gap-3 text-slate-100 point-28pt font-medium leading-relaxed">
                                <span class="${tRight.text} font-black text-2xl shrink-0 mt-1">•</span>
                                <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                            </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            </div>
            `;
        } else if (layout === '3card') {
            const cards = slide.cards || [];
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-5 lg:gap-6 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    ${cards.map((c, idx) => {
                        const tCard = getThemeStyles(c.theme || (idx === 0 ? 'blue' : (idx === 1 ? 'teal' : 'amber')));
                        return `
                        <div class="bg-slate-800/90 rounded-2xl border-2 ${tCard.border} p-5 lg:p-6 flex flex-col shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tCard.bar}"></div>
                            <h3 class="text-xl md:text-2xl font-black ${tCard.text} mb-3.5">
                                ${escapeHtml(c.title)}
                            </h3>
                            <ul class="space-y-3">
                                ${(c.points || []).map(p => `
                                <li class="flex items-start gap-2.5 text-slate-100 point-multi-card font-medium leading-relaxed">
                                    <span class="${tCard.text} font-black text-2xl shrink-0 mt-1">•</span>
                                    <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                                </li>
                                `).join('')}
                            </ul>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        } else if (layout === '4card') {
            const cards = slide.cards || [];
            html = `
            <div class="h-full flex flex-col animate-fadeIn">
                ${renderHeader(slide.badge, slide.sec, slide.title, slide.subtitle, curNum, total)}
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-5 py-2 items-stretch overflow-y-auto custom-scrollbar">
                    ${cards.map((c, idx) => {
                        const tCard = getThemeStyles(c.theme || (idx === 0 ? 'blue' : (idx === 1 ? 'teal' : (idx === 2 ? 'indigo' : 'amber'))));
                        return `
                        <div class="bg-slate-800/90 rounded-2xl border-2 ${tCard.border} p-4 lg:p-5 flex flex-col shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r ${tCard.bar}"></div>
                            ${c.num ? `
                            <span class="text-xs font-black tracking-wider px-2 py-0.5 rounded ${tCard.badge} w-fit mb-2">
                                ${escapeHtml(c.num)}
                            </span>
                            ` : ''}
                            <h3 class="text-lg md:text-xl font-black text-white mb-2.5">
                                ${escapeHtml(c.title)}
                            </h3>
                            <ul class="space-y-2 lg:space-y-2.5">
                                ${(c.points || []).map(p => `
                                <li class="flex items-start gap-2 text-slate-100 point-multi-card font-medium leading-relaxed">
                                    <span class="${tCard.text} font-bold text-xl shrink-0 mt-1">•</span>
                                    <span class="${p.includes('★') ? 'text-amber-300 font-bold' : ''}">${escapeHtml(p)}</span>
                                </li>
                                `).join('')}
                            </ul>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
            `;
        } else if (layout === 'closing') {
            html = `
            <div class="h-full flex flex-col justify-center px-8 md:px-20 animate-fadeIn">
                <div class="inline-block px-5 py-2 rounded-xl bg-amber-600 text-white font-black text-base md:text-lg tracking-widest mb-6 w-fit shadow-xl shadow-amber-500/30">
                    UNIT COMPLETED
                </div>
                <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white mb-6 leading-tight max-w-5xl drop-shadow-md">
                    ${escapeHtml(slide.title || '單元授課完畢')}
                </h2>
                <p class="text-2xl md:text-3xl text-slate-200 font-bold max-w-4xl leading-relaxed mb-8">
                    ${escapeHtml(slide.subtitle || '感謝各位的專注投入與深度研討！請個人組長妥善保存工作表。')}
                </p>
                <div class="pt-6 border-t-2 border-slate-800 text-lg md:text-xl font-bold text-teal-400">
                    ${escapeHtml(slide.final_message || '期末成果閉環：Antigravity 生成單頁網站 ➔ GitHub Pages 全球發布 ➔ Demo Day 競演')}
                </div>
            </div>
            `;
        }

        // CRITICAL: Put HTML into stage!
        stage.innerHTML = html;
    }

    function prevSlide() {
        if (currentSlideIdx > 0) {
            currentSlideIdx--;
            renderCurrentSlide();
        } else if (currentWeekIdx > 0) {
            currentWeekIdx--;
            const prevWeekSlides = CURRICULUM[currentWeekIdx].slides;
            currentSlideIdx = prevWeekSlides.length - 1;
            loadWeek();
        }
    }

    function nextSlide() {
        const currentWeekSlides = CURRICULUM[currentWeekIdx].slides;
        if (currentSlideIdx < currentWeekSlides.length - 1) {
            currentSlideIdx++;
            renderCurrentSlide();
        } else if (currentWeekIdx < CURRICULUM.length - 1) {
            currentWeekIdx++;
            currentSlideIdx = 0;
            loadWeek();
        }
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => {
                    document.body.classList.add('is-fullscreen-active');
                }).catch(err => {
                    console.log("Fullscreen request failed, applying fallback", err);
                    document.body.classList.toggle('is-fullscreen-active');
                });
            } else {
                document.body.classList.toggle('is-fullscreen-active');
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen().then(() => {
                    document.body.classList.remove('is-fullscreen-active');
                }).catch(() => {
                    document.body.classList.remove('is-fullscreen-active');
                });
            } else {
                document.body.classList.remove('is-fullscreen-active');
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUI);
    } else {
        initUI();
    }
    </script>
</body>
</html>
